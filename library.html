<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gibraltar Monkey Library // MUoG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--bg2:#121621;--panel:#1a1f2e;--panel2:#23293b;--line:#2a3142;--red:#e50914;--blue:#0066ff;--cyan:#00d4ff;--purple:#a855f7;--gold:#fbbf24;--green:#10b981;--white:#ffffff;--gray:#94a3b8;--light-gray:#cbd5e1;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.background{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;overflow:hidden}
.background::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(0,102,255,0.15) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(168,85,247,0.1) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(0,212,255,0.08) 0%,transparent 60%);animation:bgMove 20s ease-in-out infinite}
@keyframes bgMove{0%,100%{transform:translate(0,0)} 50%{transform:translate(-2%,2%)}}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:20px 4%;background:linear-gradient(180deg,rgba(11,13,20,0.95) 0%,rgba(11,13,20,0.85) 100%);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap;gap:14px}
.nav-left{display:flex;align-items:center;gap:20px}
.nav-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--red),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--white);box-shadow:0 4px 20px rgba(229,9,20,0.4)}
.nav-brand{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--white);letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,var(--white),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-center{display:flex;gap:30px}
.nav-link{color:var(--gray);font-size:14px;font-weight:500;transition:all 0.3s;position:relative;padding:8px 0}
.nav-link:hover{color:var(--white)}
.nav-link::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width 0.3s}
.nav-link:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lang-switch{display:flex;gap:6px;background:var(--panel);padding:6px;border-radius:8px;border:1px solid var(--line);flex-wrap:wrap}
.lang-switch a{color:var(--gray);font-size:12px;font-weight:700;padding:8px 12px;border-radius:6px;transition:all 0.3s;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.lang-switch a:hover,.lang-switch a.active{color:var(--white);background:var(--blue);box-shadow:0 4px 15px rgba(0,102,255,0.4)}
.return-hub{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--gray);font-size:13px;font-weight:600;transition:all 0.3s}
.return-hub:hover{color:var(--white);border-color:var(--blue);background:rgba(0,102,255,0.15);box-shadow:0 4px 20px rgba(0,102,255,0.3)}

/* ============ LIBRARY WELCOME (new) ============ */
.lib-hero{position:relative;padding:170px 4% 70px;text-align:center;overflow:hidden}
.lib-hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, rgba(251,191,36,0.10), transparent 45%),linear-gradient(180deg, rgba(11,13,20,0.2) 0%, var(--bg) 100%);pointer-events:none}
.lib-seal{position:relative;z-index:1;width:200px;height:200px;margin:0 auto 30px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(251,191,36,.35), 0 20px 60px rgba(0,0,0,.6), 0 0 60px rgba(251,191,36,.15);}
.lib-seal img{width:100%;height:100%;object-fit:cover;display:block}
.lib-welcome{position:relative;z-index:1;font-family:'Orbitron',sans-serif;font-size:clamp(24px,3.6vw,42px);font-weight:800;letter-spacing:1px;color:var(--gold);text-shadow:0 0 30px rgba(251,191,36,.35);margin-bottom:18px}
.lib-motto{position:relative;z-index:1;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:5px;color:var(--gray);text-transform:uppercase;margin-bottom:26px}
.lib-intro{position:relative;z-index:1;max-width:720px;margin:0 auto 34px;color:var(--light-gray);font-size:16px;line-height:1.8}
.lib-desc-grid{position:relative;z-index:1;max-width:920px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:left}
@media(max-width:768px){.lib-desc-grid{grid-template-columns:1fr}}
.lib-desc-card{background:linear-gradient(135deg,var(--panel),var(--bg2));border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:24px;font-size:14px;color:var(--light-gray);line-height:1.75}
.lib-desc-card b{display:block;color:var(--gold);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.lib-archive-btn{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:15px 32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#c9922a);color:#1a1608;font-weight:800;font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;box-shadow:0 8px 30px rgba(251,191,36,.3);transition:.3s}
.lib-archive-btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(251,191,36,.45)}
.lib-divider{position:relative;z-index:1;max-width:200px;height:1px;margin:50px auto 0;background:linear-gradient(90deg,transparent,var(--line),transparent)}

.hero{position:relative;height:90vh;display:flex;align-items:center;padding:0 4%;overflow:hidden}
.hero-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(11,13,20,0.4) 0%,var(--bg) 100%),linear-gradient(135deg,rgba(0,102,255,0.15) 0%,rgba(168,85,247,0.1) 50%,rgba(0,212,255,0.15) 100%)}
.hero-grid{position:absolute;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:50px 50px;opacity:0.3}
.hero-content{position:relative;z-index:2;max-width:900px}
.hero-label{display:inline-block;padding:8px 16px;background:rgba(0,102,255,0.15);border:1px solid rgba(0,102,255,0.3);border-radius:20px;color:var(--cyan);font-size:12px;font-weight:700;margin-bottom:24px;text-transform:uppercase;letter-spacing:3px;box-shadow:0 4px 20px rgba(0,102,255,0.2)}
.hero-title{font-family:'Orbitron',sans-serif;font-size:72px;font-weight:900;line-height:1.1;margin-bottom:24px;color:var(--white);text-shadow:0 0 40px rgba(0,102,255,0.5),0 0 80px rgba(0,212,255,0.3);animation:titleGlow 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 0 40px rgba(0,102,255,0.5),0 0 80px rgba(0,212,255,0.3)} 50%{text-shadow:0 0 60px rgba(0,102,255,0.7),0 0 100px rgba(0,212,255,0.5)}}
.hero-subtitle{font-size:22px;color:var(--gray);margin-bottom:32px;line-height:1.6}
.hero-meta{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:32px}
.hero-meta-item{display:flex;align-items:center;gap:10px;color:var(--light-gray);font-size:14px;font-weight:500}
.hero-meta-icon{color:var(--cyan)}
.hero-badge{padding:6px 14px;background:var(--green);color:var(--bg);font-size:11px;font-weight:800;border-radius:4px;text-transform:uppercase;letter-spacing:1px}
.hero-desc{font-size:18px;line-height:1.7;margin-bottom:40px;color:var(--light-gray);max-width:750px;border-left:3px solid var(--blue);padding-left:24px}
.hero-buttons{display:flex;gap:16px;flex-wrap:wrap}
.btn{padding:16px 36px;border-radius:8px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:12px;font-family:'Inter',sans-serif;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s}
.btn:hover::before{left:100%}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:var(--white);box-shadow:0 8px 30px rgba(0,102,255,0.4)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,102,255,0.6)}
.btn-secondary{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:var(--white)}
.btn-secondary:hover{background:rgba(255,255,255,0.15);border-color:var(--white)}
.content{padding:80px 4%;position:relative}
.section-label{display:flex;align-items:center;gap:12px;margin-bottom:40px}
.section-dot{width:12px;height:12px;background:var(--red);border-radius:50%;box-shadow:0 0 20px var(--red)}
.section-title{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:800;color:var(--white);letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:60px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.grid{grid-template-columns:1fr}
.hero-title{font-size:48px}
.hero{height:75vh}}
.card{background:linear-gradient(135deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:32px;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--purple));opacity:0;transition:opacity 0.3s}
.card:hover::before{opacity:1}
.card:hover{transform:translateY(-12px);border-color:var(--blue);box-shadow:0 20px 60px rgba(0,102,255,0.3)}
.card-number{position:absolute;top:20px;right:20px;font-family:'Orbitron',sans-serif;font-size:48px;font-weight:900;color:rgba(255,255,255,0.03)}
.card-icon{width:50px;height:50px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:20px;box-shadow:0 8px 25px rgba(0,102,255,0.3)}
.card-title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--white);margin-bottom:16px;letter-spacing:0.5px}
.card-text{font-size:15px;color:var(--gray);line-height:1.7}
.card-text li{margin-bottom:10px;padding-left:0}
.timeline-card{background:linear-gradient(135deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:32px;grid-column:span 2}
@media(max-width:768px){.timeline-card{grid-column:span 1}}
.timeline-table{width:100%;margin-top:20px;border-collapse:separate;border-spacing:0}
.timeline-table th{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;padding:16px;text-align:left;background:rgba(0,102,255,0.1);border-bottom:2px solid var(--blue)}
.timeline-table td{padding:16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--light-gray);transition:all 0.3s}
.timeline-table tr:hover td{background:rgba(0,102,255,0.05);color:var(--white)}
.timeline-table tr:last-child td{border-bottom:none}
.timeline-date{font-family:'Orbitron',sans-serif;font-weight:700;color:var(--blue)}
.alert-box{padding:20px 24px;border-radius:12px;margin:16px 0;font-size:15px;position:relative;overflow:hidden}
.alert-box::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px}
.alert-warn{background:linear-gradient(90deg,rgba(229,9,20,0.15),transparent);border:1px solid rgba(229,9,20,0.3);color:var(--light-gray)}
.alert-warn::before{background:var(--red);box-shadow:0 0 20px var(--red)}
.alert-ok{background:linear-gradient(90deg,rgba(16,185,129,0.15),transparent);border:1px solid rgba(16,185,129,0.3);color:var(--light-gray)}
.alert-ok::before{background:var(--green);box-shadow:0 0 20px var(--green)}
.alert-info{background:linear-gradient(90deg,rgba(0,212,255,0.15),transparent);border:1px solid rgba(0,212,255,0.3);color:var(--light-gray)}
.alert-info::before{background:var(--cyan);box-shadow:0 0 20px var(--cyan)}
.quote-section{margin:60px 0}
.quote-box{background:linear-gradient(135deg,var(--panel),var(--bg2));border:1px solid var(--line);border-left:4px solid var(--red);border-radius:16px;padding:40px;position:relative;overflow:hidden}
.quote-box::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(229,9,20,0.05) 0%,transparent 70%);animation:quotePulse 4s ease-in-out infinite}
@keyframes quotePulse{0%,100%{transform:translate(0,0)} 50%{transform:translate(-2%,2%)}}
.quote-text{font-size:24px;font-style:italic;color:var(--light-gray);line-height:1.8;position:relative;z-index:1;font-family:'Inter',sans-serif}
.quote-author{margin-top:20px;font-size:14px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:2px}
.footer{padding:50px 4%;border-top:1px solid var(--line);background:var(--bg2);position:relative}
.footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;align-items:center}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr;text-align:center}}
.footer-status{display:flex;align-items:center;gap:12px;color:var(--gray);font-size:13px}
.footer-dot{width:10px;height:10px;background:var(--green);border-radius:50%;animation:pulse 2s ease-in-out infinite;box-shadow:0 0 20px var(--green)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.2)}}
.footer-item{color:var(--light-gray);font-size:13px;font-weight:600}
.footer-next{color:var(--cyan);font-size:13px}
.scroll-progress{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));z-index:1001;transform-origin:left;transition:transform 0.1s}
</style>
</head>
