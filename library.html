<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gibraltar Monkey Library // MUoG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--bg2:#121621;--panel:#1a1f2e;--panel2:#23293b;--line:#2a3142;--red:#e50914;--gold:#fbbf24;--gold2:#c9922a;--brown:#6b4a2f;--brown-light:#8a6238;--white:#ffffff;--gray:#94a3b8;--light-gray:#cbd5e1;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.background{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;overflow:hidden}
.background::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(251,191,36,0.10) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(229,9,20,0.08) 0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(107,74,47,0.10) 0%,transparent 60%);animation:bgMove 20s ease-in-out infinite}
@keyframes bgMove{0%,100%{transform:translate(0,0)} 50%{transform:translate(-2%,2%)}}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:20px 4%;background:linear-gradient(180deg,rgba(11,13,20,0.95) 0%,rgba(11,13,20,0.85) 100%);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap;gap:14px}
.nav-left{display:flex;align-items:center;gap:20px}
.nav-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--red),var(--brown));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--white);box-shadow:0 4px 20px rgba(229,9,20,0.4)}
.nav-brand{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--white);letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,var(--white),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-center{display:flex;gap:30px}
.nav-link{color:var(--gray);font-size:14px;font-weight:500;transition:all 0.3s;position:relative;padding:8px 0}
.nav-link:hover{color:var(--white)}
.nav-link::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--red));transition:width 0.3s}
.nav-link:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lang-switch{display:flex;gap:6px;background:var(--panel);padding:6px;border-radius:8px;border:1px solid var(--line);flex-wrap:wrap}
.lang-switch a{color:var(--gray);font-size:12px;font-weight:700;padding:8px 12px;border-radius:6px;transition:all 0.3s;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.lang-switch a:hover,.lang-switch a.active{color:#1a1608;background:var(--gold);box-shadow:0 4px 15px rgba(251,191,36,0.4)}
.return-hub{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--gray);font-size:13px;font-weight:600;transition:all 0.3s}
.return-hub:hover{color:var(--white);border-color:var(--gold);background:rgba(251,191,36,0.12);box-shadow:0 4px 20px rgba(251,191,36,0.25)}

/* ============ LIBRARY WELCOME ============ */
.lib-hero{position:relative;padding:170px 4% 70px;text-align:center;overflow:hidden}
.lib-hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, rgba(251,191,36,0.10), transparent 45%),linear-gradient(180deg, rgba(11,13,20,0.2) 0%, var(--bg) 100%);pointer-events:none}
