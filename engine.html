<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock Engine v1</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

/* HEADER */
header{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header b{
letter-spacing:2px;
}

nav button{
background:#111827;
border:1px solid #1f2a3a;
color:#aaa;
padding:6px 10px;
margin-left:5px;
cursor:pointer;
border-radius:6px;
}

nav button:hover{
color:#4aa3ff;
border-color:#4aa3ff;
}

/* LAYERS */
.view{
display:none;
height:calc(100vh - 55px);
padding:15px;
box-sizing:border-box;
}

.active{
display:block;
}

/* MAP */
.map{
position:relative;
height:100%;
background:radial-gradient(circle,#0f1626,#070A10);
}

.node{
position:absolute;
width:180px;
padding:12px;
background:#111827;
border:1px solid #1f2a3a;
border-radius:10px;
text-align:center;
cursor:pointer;
}

.node h3{
margin:0;
color:#4aa3ff;
font-size:14px;
}

/* CORE */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.panel{
background:#111827;
border:1px solid #1f2a3a;
padding:12px;
border-radius:10px;
}

.badge{
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

.green{background:#0f3d2e;color:#3dff9c;}
.yellow{background:#3d3410;color:#ffd24a;}
.red{background:#3d1010;color:#ff5c5c;}

button.action{
margin-top:8px;
padding:6px 10px;
background:#111827;
border:1px solid #4aa3ff;
color:#4aa3ff;
border-radius:6px;
cursor:pointer;
}

button.action:hover{
background:#4aa3ff;
color:#000;
}
</style>

</head>

<body>

<header>
<div><b>G-ROCK ENGINE v1</b></div>

<nav>
<button onclick="show('map')">MAP</button>
<button onclick="show('core')">CORE</button>
<button onclick="show('live')">LIVE</button>
</nav>
</header>

<!-- MAP VIEW -->
<div id="map" class="view active">
<div class="map">

<div class="node" style="top:20%;left:15%;" onclick="select('uni')">
<h3>University</h3>
</div>

<div class="node" style="top:60%;left:15%;" onclick="select('bank')">
<h3>Bank</h3>
</div>

<div class="node" style="top:40%;left:45%;" onclick="select('parl')">
<h3>Parliament</h3>
</div>

<div class="node" style="top:70%;left:75%;" onclick="select('ceuta')">
<h3>Ceuta</h3>
</div>

</div>
</div>

<!-- CORE VIEW -->
<div id="core" class="view">
<div class="grid">

<div class="panel">
<h3>Economy</h3>
Status: <span id="eco" class="badge green">STABLE</span>
<br>
<button class="action" onclick="shock()">Market Shock</button>
</div>

<div class="panel">
<h3>Governance</h3>
Status: <span id="gov" class="badge green">STABLE</span>
<br>
<button class="action" onclick="crisis()">Crisis</button>
</div>

<div class="panel">
<h3>Academia</h3>
Status: <span id="uni" class="badge green">STABLE</span>
<br>
<button class="action" onclick="boost()">Boost</button>
</div>

<div class="panel">
<h3>System Core</h3>
Integrity: <span id="core">100%</span>
</div>

</div>
</div>

<!-- LIVE VIEW -->
<div id="live" class="view">
<div class="panel">
<h2>LIVE SIMULATION</h2>
<p>System is running unified state engine.</p>

<div id="log"></div>
</div>
</div>

<script>

let state = {
  eco: "STABLE",
  gov: "STABLE",
  uni: "STABLE",
  core: 100
};

function show(v){
document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
document.getElementById(v).classList.add('active');
}

function update(){
document.getElementById("eco").innerText = state.eco;
document.getElementById("gov").innerText = state.gov;
document.getElementById("uni").innerText = state.uni;
document.getElementById("core").innerText = state.core + "%";
}

function log(msg){
document.getElementById("log").innerHTML += "<div>> " + msg + "</div>";
}

/* EVENTS */
function shock(){
state.eco = "VOLATILE";
state.core -= 10;
log("Economic shock triggered");
update();
}

function crisis(){
state.gov = "UNSTABLE";
state.core -= 15;
log("Political crisis triggered");
update();
}

function boost(){
state.uni = "OVERACTIVE";
state.core += 5;
log("Research boost activated");
update();
}

function select(node){
log("Node selected: " + node);
}

update();

</script>

</body>
  </html>
