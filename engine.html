<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock Engine v1 + Save</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

header{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

nav button{
background:#111827;
border:1px solid #1f2a3a;
color:#aaa;
padding:6px 10px;
margin-left:5px;
cursor:pointer;
border-radius:6px;
}

nav button:hover{
color:#4aa3ff;
border-color:#4aa3ff;
}

.view{
display:none;
height:calc(100vh - 55px);
padding:15px;
box-sizing:border-box;
}

.active{display:block;}

.map{
position:relative;
height:100%;
background:radial-gradient(circle,#0f1626,#070A10);
}

.node{
position:absolute;
width:180px;
padding:12px;
background:#111827;
border:1px solid #1f2a3a;
border-radius:10px;
text-align:center;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.panel{
background:#111827;
border:1px solid #1f2a3a;
padding:12px;
border-radius:10px;
}

.badge{
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

.green{background:#0f3d2e;color:#3dff9c;}
.yellow{background:#3d3410;color:#ffd24a;}
.red{background:#3d1010;color:#ff5c5c;}

button.action{
margin-top:8px;
padding:6px 10px;
background:#111827;
border:1px solid #4aa3ff;
color:#4aa3ff;
border-radius:6px;
cursor:pointer;
}

button.action:hover{
background:#4aa3ff;
color:#000;
}

</style>

</head>

<body>

<header>
<div><b>G-ROCK ENGINE v1 (SAVE)</b></div>

<nav>
<button onclick="show('map')">MAP</button>
<button onclick="show('core')">CORE</button>
<button onclick="resetWorld()">RESET</button>
</nav>
</header>

<!-- MAP -->
<div id="map" class="view active">
<div class="map">

<div class="node" style="top:20%;left:15%;" onclick="selectNode('uni')">University</div>
<div class="node" style="top:60%;left:15%;" onclick="selectNode('bank')">Bank</div>
<div class="node" style="top:40%;left:45%;" onclick="selectNode('parl')">Parliament</div>
<div class="node" style="top:70%;left:75%;" onclick="selectNode('ceuta')">Ceuta</div>

</div>
</div>

<!-- CORE -->
<div id="core" class="view">
<div class="grid">

<div class="panel">
<h3>Economy</h3>
Status: <span id="eco" class="badge green"></span>
<br>
<button class="action" onclick="shock()">Market Shock</button>
</div>

<div class="panel">
<h3>Governance</h3>
Status: <span id="gov" class="badge green"></span>
<br>
<button class="action" onclick="crisis()">Crisis</button>
</div>

<div class="panel">
<h3>Academia</h3>
Status: <span id="uni" class="badge green"></span>
<br>
<button class="action" onclick="boost()">Boost</button>
</div>

<div class="panel">
<h3>Core</h3>
Integrity: <span id="coreVal"></span>%
</div>

</div>
</div>

<script>

/* ===== STATE ===== */
let state = {
  eco: "STABLE",
  gov: "STABLE",
  uni: "STABLE",
  core: 100
};

/* ===== LOAD SAVE ===== */
function load(){
let saved = localStorage.getItem("grock_state");
if(saved){
state = JSON.parse(saved);
}
}

/* ===== SAVE ===== */
function save(){
localStorage.setItem("grock_state", JSON.stringify(state));
}

/* ===== UPDATE UI ===== */
function update(){
document.getElementById("eco").innerText = state.eco;
document.getElementById("gov").innerText = state.gov;
document.getElementById("uni").innerText = state.uni;
document.getElementById("coreVal").innerText = state.core;
save();
}

/* ===== NAV ===== */
function show(v){
document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
document.getElementById(v).classList.add('active');
}

/* ===== EVENTS ===== */
function shock(){
state.eco = "VOLATILE";
state.core -= 10;
update();
}

function crisis(){
state.gov = "UNSTABLE";
state.core -= 15;
update();
}

function boost(){
state.uni = "OVERACTIVE";
state.core += 5;
update();
}

function selectNode(n){
console.log("Node:", n);
}

/* ===== RESET ===== */
function resetWorld(){
localStorage.removeItem("grock_state");
state = {
  eco: "STABLE",
  gov: "STABLE",
  uni: "STABLE",
  core: 100
};
update();
}

/* INIT */
load();
update();

</script>

</body>
</html>
