<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Africa Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#05070d;
}

header{
padding:12px;
text-align:center;
background:#0b0f18;
color:#4aa3ff;
border-bottom:1px solid #1f2a3a;
}

#map{
height:calc(100vh - 50px);
width:100%;
}
</style>
</head>

<body>

<header>
REAL GEO AFRICA MAP
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// INIT MAP (center Africa)
const map = L.map('map').setView([25, 0], 3);

// TILE LAYER (real world map)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// CEUTA
L.marker([35.8894, -5.3213]).addTo(map)
.bindPopup("Ceuta (Spain)");

// TANGIER
L.marker([35.7595, -5.8340]).addTo(map)
.bindPopup("Tangier (Morocco)");

// CANARY ISLANDS
L.marker([28.2916, -16.6291]).addTo(map)
.bindPopup("Canary Islands (Spain)");
</script>

</body>
</html>
