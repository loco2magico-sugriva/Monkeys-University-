<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Map System</title>

<style>
body{
margin:0;
background:#05070d;
font-family:Arial,sans-serif;
color:#e6e6e6;
overflow:hidden;
}

/* HEADER */
header{
padding:16px;
text-align:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

h1{
margin:0;
font-size:18px;
color:#4aa3ff;
letter-spacing:2px;
}

/* MAP AREA */
.map{
position:relative;
width:100%;
height:calc(100vh - 60px);
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at center,#0f1626 0%,#070A10 70%);
}

/* AFRICA OUTLINE (SVG STYLIZED) */
svg{
width:420px;
height:520px;
opacity:0.25;
}

/* NODES */
.node{
position:absolute;
width:12px;
height:12px;
border-radius:50%;
background:#4aa3ff;
border:2px solid white;
box-shadow:0 0 12px rgba(74,163,255,0.6);
cursor:pointer;
transition:0.2s;
}

.node:hover{
transform:scale(1.8);
}

/* LABELS */
.label{
position:absolute;
font-size:11px;
color:#4aa3ff;
}

/* CEUTA */
#ceuta{top:28%;left:49%;}
#ceutaL{top:26%;left:52%;}

/* MOROCCO */
#morocco{top:35%;left:45%;}
#moroccoL{top:33%;left:48%;}

/* CANARY ISLANDS */
#canary{top:42%;left:38%;}
#canaryL{top:40%;left:41%;}

/* PANEL */
.panel{
position:absolute;
bottom:20px;
left:20px;
background:#111827;
border:1px solid #1f2a3a;
padding:14px;
border-radius:10px;
opacity:0;
transform:translateY(10px);
transition:0.3s;
max-width:260px;
}

.panel.active{
opacity:1;
transform:translateY(0);
}

button{
margin-top:8px;
background:#0b0f18;
border:1px solid #1f2a3a;
color:#aaa;
padding:6px 10px;
cursor:pointer;
}

button:hover{
border-color:#4aa3ff;
color:white;
}
</style>
</head>

<body>

<header>
<h1>AFRICA MAP SYSTEM</h1>
</header>

<div class="map">

<!-- SIMPLE AFRICA OUTLINE -->
<svg viewBox="0 0 200 260">
<path d="M90,10 
C120,20 140,40 150,70
C160,110 140,150 150,180
C160,220 120,250 90,250
C60,240 40,220 35,180
C30,140 40,110 30,80
C25,50 50,20 90,10Z"
fill="#4aa3ff"/>
</svg>

<!-- NODES -->
<div id="ceuta" class="node" onclick="openPanel('Ceuta Node')"></div>
<div id="ceutaL" class="label">Ceuta</div>

<div id="morocco" class="node" onclick="openPanel('Morocco Node')"></div>
<div id="moroccoL" class="label">Morocco</div>

<div id="canary" class="node" onclick="openPanel('Canary Islands Node')"></div>
<div id="canaryL" class="label">Canary Islands</div>

<!-- PANEL -->
<div class="panel" id="panel">
<h3 id="title" style="margin:0;color:#4aa3ff;">Node</h3>
<p>Status: ACTIVE</p>
<button onclick="closePanel()">Close</button>
</div>

</div>

<script>
function openPanel(name){
document.getElementById("panel").classList.add("active");
document.getElementById("title").innerText = name;
}

function closePanel(){
document.getElementById("panel").classList.remove("active");
}
</script>

</body>
</html>
