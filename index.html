<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK</title>

<link rel="stylesheet" href="mu-core.css">

<style>

/* ===== BASIC STYLE ===== */
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
}

/* ===== INTRO ===== */
.intro{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 3.5s forwards;
text-align:center;
}

.intro h1{
font-size:42px;
letter-spacing:5px;
opacity:0;
animation:fadeIn 1s ease forwards;
}

.intro p{
margin-top:10px;
opacity:0;
color:#aaa;
animation:fadeIn 1s ease 1s forwards;
font-size:12px;
text-transform:uppercase;
}

/* ===== MAIN ===== */
main{
opacity:0;
animation:show 1s ease 3.6s forwards;
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

nav a{
color:white;
text-decoration:none;
margin-right:14px;
opacity:0.8;
}

nav a:hover{
color:#4aa3ff;
}

/* LANG */
.lang a{
margin-left:10px;
color:#aaa;
text-decoration:none;
font-size:12px;
cursor:pointer;
}

.lang a:hover{
color:#4aa3ff;
}

/* ===== HERO ===== */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:40px;
letter-spacing:3px;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
max-width:1000px;
margin:40px auto;
padding:0 20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2a3a;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-5px);
}
