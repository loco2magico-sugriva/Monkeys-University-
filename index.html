<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-WORLD SYSTEM</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
}

/* ===== INTRO ===== */
.intro{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 4s forwards;
text-align:center;
}

.intro h1{
font-size:64px;
letter-spacing:10px;
margin:0;
opacity:0;
animation:fadeIn 1s ease forwards;
text-transform:uppercase;
color:#ffffff;
}

.intro p{
margin-top:10px;
opacity:0;
color:#aaa;
font-size:12px;
text-transform:uppercase;
animation:fadeIn 1s ease 1s forwards;
}

/* ===== MAIN ===== */
main{
opacity:0;
animation:show 1s ease 4.2s forwards;
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

.lang a{
margin-left:10px;
color:#aaa;
text-decoration:none;
font-size:12px;
}

.lang a:hover{
color:#4aa3ff;
}

/* ===== HERO ===== */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:44px;
letter-spacing:3px;
margin:0;
}

.hero p{
opacity:0.7;
margin-top:10px;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:16px;
max-width:900px;
margin:40px auto;
padding:0 20px;
}

.card{
background:#111827;
border:1px solid #1f2a3a;
padding:22px;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.2s;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-5px);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<!-- ===== INTRO ===== -->
<div class="intro">
  <h1>G-WORLD PRESENTS</h1>
  <p>MONKEYS UNIVERSITY OF GIBRALTAR</p>
  <p>POWERED BY G-SYSTEM</p>
</div>

<!-- ===== MAIN ===== -->
<main>

<header>
  <div><b>G-WORLD SYSTEM</b></div>

  <div class="lang">
    <a href="index.html">EN</a>
    <a href="index-pl.html">PL</a>
    <a href="index-es.html">ES</a>
    <a href="index-fr.html">FR</a>
  </div>
</header>

<section class="hero">
  <h1>G-ROCK STATE</h1>
  <p>Distributed Simulation Universe</p>
</section>

<section class="grid">

  <div class="card" onclick="location.href='university.html'">UNIVERSITY</div>
  <div class="card" onclick="location.href='bank.html'">BANK</div>
  <div class="card" onclick="location.href='parliament.html'">PARLIAMENT</div>
  <div class="card" onclick="location.href='map.html'">WORLD MAP</div>
  <div class="card" onclick="location.href='season1.html'">EPISODES</div>
  <div class="card" onclick="location.href='lore.html'">LORE</div>

</section>

</main>

</body>
</html>
