<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK SYSTEM</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

.lang a{
margin-left:10px;
color:#aaa;
text-decoration:none;
font-size:12px;
}

.lang a:hover{
color:#4aa3ff;
}

/* HERO */
.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:44px;
letter-spacing:3px;
margin:0;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:16px;
max-width:900px;
margin:40px auto;
padding:0 20px;
}

.card{
background:#111827;
border:1px solid #1f2a3a;
padding:22px;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.2s;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-5px);
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
opacity:0.5;
font-size:12px;
}
</style>
</head>

<body>

<header>
<div><b>G-ROCK SYSTEM</b></div>

<div class="lang">

<a href="index-pl.html">PL</a>

</div>
</header>

<section class="hero">

<p>Monkeys University of Gibraltar • G-System Active</p>
</section>

<section class="grid">

<div class="card" onclick="location.href='university.html'">UNIVERSITY</div>
<div class="card" onclick="location.href='bank.html'">BANK OF MONKEYS</div>
<div class="card" onclick="location.href='parliament.html'">PARLIAMENT</div>
<div class="card" onclick="location.href='map.html'">WORLD MAP</div>
<div class="card" onclick="location.href='season1.html'">EPISODES</div>
<div class="card" onclick="location.href='lore.html'">LORE</div>

</section>

<footer>
G-ROCK SYSTEM • MAIN HUB
</footer>

</body>
</html>
