<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock System</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

/* ===== INTRO ===== */
#intro{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
text-align:center;
animation:fadeOut 3.5s ease 3.5s forwards;
}

#intro h1{
font-size:52px;
letter-spacing:4px;
opacity:0;
animation:fadeIn 1s ease forwards;
}

#intro h2{
font-size:28px;
margin-top:10px;
opacity:0;
animation:fadeIn 1s ease 1s forwards;
font-weight:normal;
color:#aaa;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

nav button{
background:#111827;
border:1px solid #1f2a3a;
color:#aaa;
padding:6px 10px;
margin-left:6px;
border-radius:6px;
cursor:pointer;
}

nav button:hover{
color:#4aa3ff;
border-color:#4aa3ff;
}

/* ===== VIEWS ===== */
.view{
display:none;
height:calc(100vh - 55px);
padding:15px;
box-sizing:border-box;
}

.active{display:block;}

/* MAP */
.map{
position:relative;
height:100%;
background:radial-gradient(circle,#0f1626,#070A10);
}

.node{
position:absolute;
width:180px;
padding:12px;
background:#111827;
border:1px solid #1f2a3a;
border-radius:10px;
text-align:center;
cursor:pointer;
}

/* CORE */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.panel{
background:#111827;
border:1px solid #1f2a3a;
border-radius:10px;
padding:12px;
}

.badge{
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

.green{background:#0f3d2e;color:#3dff9c;}
.yellow{background:#3d3410;color:#ffd24a;}

button.action{
margin-top:8px;
padding:6px 10px;
background:#111827;
border:1px solid #4aa3ff;
color:#4aa3ff;
border-radius:6px;
cursor:pointer;
}

button.action:hover{
background:#4aa3ff;
color:#000;
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>G-ROCK STATE</h1>
  <h2>MONKEYS UNIVERSITY SYSTEM</h2>
</div>

<!-- MAIN APP -->
<div id="app">

<header>
<div><b>G-ROCK SYSTEM</b></div>

<nav>
<button onclick="show('map')">MAP</button>
<button onclick="show('core')">CORE</button>
<button onclick="show('live')">LIVE</button>
</nav>
</header>

<!-- MAP -->
<div id="map" class="view active">
<div class="map">

<div class="node" style="top:20%;left:15%;" onclick="eventNode('University')">University</div>
<div class="node" style="top:60%;left:15%;" onclick="eventNode('Bank')">Bank</div>
<div class="node" style="top:40%;left:45%;" onclick="eventNode('Parliament')">Parliament</div>
<div class="node" style="top:70%;left:75%;" onclick="eventNode('Ceuta')">Ceuta</div>

</div>
</div>

<!-- CORE -->
<div id="core" class="view">
<div class="grid">

<div class="panel">
<h3>Economy</h3>
Status: <span id="eco" class="badge green">STABLE</span>
<br>
<button class="action" onclick="shock()">Shock</button>
</div>

<div class="panel">
<h3>Governance</h3>
Status: <span id="gov" class="badge green">STABLE</span>
<br>
<button class="action" onclick="crisis()">Crisis</button>
</div>

<div class="panel">
<h3>Academia</h3>
Status: <span id="uni" class="badge green">STABLE</span>
<br>
<button class="action" onclick="boost()">Boost</button>
</div>

<div class="panel">
<h3>Core</h3>
Integrity: <span id="coreVal">100</span>%
</div>

</div>
</div>

<!-- LIVE -->
<div id="live" class="view">
<div class="panel">
<h2>LIVE LOG</h2>
<div id="log"></div>
</div>
</div>

</div>

<script>

let state = {
 eco:"STABLE",
 gov:"STABLE",
 uni:"STABLE",
 core:100
};

function show(v){
document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
document.getElementById(v).classList.add('active');
}

function log(msg){
document.getElementById("log").innerHTML += "> " + msg + "<br>";
}

function update(){
document.getElementById("eco").innerText = state.eco;
document.getElementById("gov").innerText = state.gov;
document.getElementById("uni").innerText = state.uni;
document.getElementById("coreVal").innerText = state.core;
}

/* EVENTS */
function shock(){
state.eco="VOLATILE";
state.core-=10;
update(); log("Economy shock");
}

function crisis(){
state.gov="UNSTABLE";
state.core-=15;
update(); log("Crisis triggered");
}

function boost(){
state.uni="OVERACTIVE";
state.core+=5;
update(); log("Research boost");
}

function eventNode(n){
log("Node: "+n);
update();
}

/* INTRO REMOVE */
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},3500);

update();

</script>

</body>
          </html>
