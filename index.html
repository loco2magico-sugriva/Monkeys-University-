<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock State</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

/* ================= CINEMATIC INTRO ================= */
.intro{
position:fixed;
inset:0;
background:
radial-gradient(circle at center,#000 0%,#05070d 60%,#000 100%);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
text-align:center;
animation:fadeOut 4.2s ease 4.2s forwards;
}

.intro::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(120deg,transparent,rgba(74,163,255,0.08),transparent);
animation:scan 2.5s infinite linear;
}

@keyframes scan{
0%{transform:translateX(-100%);}
100%{transform:translateX(100%);}
}

.intro h1{
font-size:76px;
letter-spacing:10px;
margin:0;
color:#4aa3ff;
text-shadow:0 0 40px rgba(74,163,255,0.7);
opacity:0;
animation:fadeIn 1.2s ease forwards;
}

.intro h2{
font-size:28px;
margin-top:10px;
color:#ddd;
font-weight:normal;
letter-spacing:2px;
opacity:0;
animation:fadeIn 1.2s ease 0.8s forwards;
}

.intro p{
font-size:14px;
margin-top:10px;
color:#888;
letter-spacing:2px;
opacity:0;
animation:fadeIn 1.2s ease 1.6s forwards;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

/* ================= MAIN ================= */
main{
opacity:0;
animation:show 1s ease 4.7s forwards;
height:100vh;
overflow:auto;
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header b{
color:white;
}

.lang a{
margin-left:10px;
color:#aaa;
font-size:12px;
cursor:pointer;
}

.lang a:hover{
color:#4aa3ff;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;
max-width:1200px;
margin:40px auto;
padding:0 20px;
}

@media (max-width: 1100px){
.grid{grid-template-columns:repeat(2,1fr);}
}

@media (max-width: 600px){
.grid{grid-template-columns:1fr;}
}

/* CARD */
.card{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2a3a;
cursor:pointer;
text-align:center;
transition:0.25s;
min-height:110px;
display:flex;
align-items:center;
justify-content:center;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-6px);
box-shadow:0 0 20px rgba(74,163,255,0.15);
}

h3{
color:#4aa3ff;
margin:0;
}

/* subtle glow */
.card:hover h3{
text-shadow:0 0 10px rgba(74,163,255,0.4);
}

</style>

</head>

<body>

<!-- ================= INTRO ================= -->
<div class="intro">
  <h1>G-ROCK STATE</h1>
  <h2>MONKEYS UNIVERSITY OF GIBRALTAR</h2>
  <p>G-ROCK PRESENTS</p>
  <p>POWERED BY G-SYSTEM</p>
</div>

<!-- ================= MAIN ================= -->
<main>

<header>
<b>G-ROCK STATE</b>

<div class="lang">
<a onclick="setLang('en')">EN</a>
<a onclick="setLang('pl')">PL</a>
<a onclick="setLang('es')">ES</a>
<a onclick="setLang('fr')">FR</a>
</div>

</header>

<div class="grid">

<div class="card" onclick="location.href='university.html'">
<h3>Monkeys University of Gibraltar</h3>
</div>

<div class="card" onclick="location.href='bank.html'">
<h3>Bank of the Monkeys from Gibraltar</h3>
</div>

<div class="card" onclick="location.href='parliament.html'">
<h3>Parliament of the Monkeys from Gibraltar</h3>
</div>

<div class="card" onclick="location.href='episode1.html'">
<h3>Episode 1</h3>
</div>

<div class="card" onclick="location.href='map.html'">
<h3>World Map</h3>
</div>

</div>

</main>

</body>
</html>
