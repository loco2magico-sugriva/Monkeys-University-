<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock Clean System</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

/* ===== INTRO ===== */
#intro{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
text-align:center;
}

#intro h1{
font-size:50px;
letter-spacing:4px;
animation:fadeIn 1s ease forwards;
opacity:0;
}

#intro h2{
font-size:26px;
margin-top:10px;
color:#aaa;
opacity:0;
animation:fadeIn 1s ease 0.8s forwards;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

.fadeOut{
animation:out 1s ease forwards;
}

@keyframes out{
to{opacity:0; visibility:hidden;}
}

/* ===== APP ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

nav button{
background:#111827;
border:1px solid #1f2a3a;
color:#aaa;
padding:6px 10px;
margin-left:6px;
border-radius:6px;
cursor:pointer;
}

nav button:hover{
color:#4aa3ff;
border-color:#4aa3ff;
}

.view{
display:none;
height:calc(100vh - 55px);
padding:15px;
box-sizing:border-box;
}

.active{display:block;}

.map{
position:relative;
height:100%;
background:radial-gradient(circle,#0f1626,#070A10);
}

.node{
position:absolute;
width:180px;
padding:12px;
background:#111827;
border:1px solid #1f2a3a;
border-radius:10px;
text-align:center;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.panel{
background:#111827;
border:1px solid #1f2a3a;
border-radius:10px;
padding:12px;
}

.badge{
padding:4px 8px;
border-radius:6px;
font-size:12px;
}

.green{background:#0f3d2e;color:#3dff9c;}

button.action{
margin-top:8px;
padding:6px 10px;
background:#111827;
border:1px solid #4aa3ff;
color:#4aa3ff;
border-radius:6px;
cursor:pointer;
}

button.action:hover{
background:#4aa3ff;
color:#000;
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>G-ROCK STATE</h1>
  <h2>MONKEYS UNIVERSITY SYSTEM</h2>
</div>

<!-- APP -->
<div id="app">

<header>
<div><b>G-ROCK SYSTEM</b></div>
<nav>
<button onclick="show('map')">MAP</button>
<button onclick="show('core')">CORE</button>
</nav>
</header>

<!-- MAP -->
<div id="map" class="view active">
<div class="map">

<div class="node" style="top:20%;left:15%;">University</div>
<div class="node" style="top:60%;left:15%;">Bank</div>
<div class="node" style="top:40%;left:45%;">Parliament</div>
<div class="node" style="top:70%;left:75%;">Ceuta</div>

</div>
</div>

<!-- CORE -->
<div id="core" class="view">
<div class="grid">

<div class="panel">
<h3>Economy</h3>
Status: <span class="badge green">STABLE</span>
</div>

<div class="panel">
<h3>Governance</h3>
Status: <span class="badge green">STABLE</span>
</div>

</div>
</div>

</div>

<script>

/* INTRO SAFE START */
window.onload = function(){
setTimeout(()=>{
document.getElementById("intro").classList.add("fadeOut");
},3000);
};

/* NAV */
function show(v){
document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
document.getElementById(v).classList.add('active');
}

</script>

</body>
  </html>
