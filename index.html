<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK SYSTEM</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
}

/* ===== INTRO ===== */
.intro{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease 3.5s forwards;
text-align:center;
}

.intro h1{
font-size:42px;
letter-spacing:5px;
opacity:0;
animation:fadeIn 1s ease forwards;
}

.intro p{
margin-top:10px;
opacity:0;
color:#aaa;
animation:fadeIn 1s ease 1s forwards;
font-size:12px;
text-transform:uppercase;
}

/* ===== MAIN ===== */
main{
opacity:0;
animation:show 1s ease 3.6s forwards;
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

nav a{
color:white;
text-decoration:none;
margin-right:14px;
opacity:0.8;
}

nav a:hover{
color:#4aa3ff;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
max-width:1000px;
margin:40px auto;
padding:0 20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2a3a;
cursor:pointer;
text-align:center;
transition:0.2s;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-5px);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">
  <h1>G-ROCK PRESENTS</h1>
  <p>MONKEYS UNIVERSITY OF GIBRALTAR</p>
  <p>POWERED BY G-SYSTEM</p>
</div>

<!-- MAIN -->
<main>

<header>
  <div><b>G-ROCK SYSTEM</b></div>
  <nav>
    <a href="map.html">Map</a>
    <a href="season1.html">Season 1</a>
    <a href="lore.html">Lore</a>
    <a href="faculties.html">Faculties</a>
  </nav>
</header>

<section class="grid">

  <div class="card" onclick="location.href='map.html'">MAP</div>
  <div class="card" onclick="location.href='season1.html'">SEASON 1</div>
  <div class="card" onclick="location.href='lore.html'">LORE</div>
  <div class="card" onclick="location.href='faculties.html'">FACULTIES</div>

</section>

</main>

</body>
</html>
