<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock Corporation</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

/* ================= CINEMATIC INTRO ================= */
.intro{
position:fixed;
inset:0;
background:
    radial-gradient(circle at center, rgba(11, 19, 43, 0.4) 0%, #030509 70%, #000000 100%),
    linear-gradient(rgba(18, 24, 38, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
    linear-gradient(90deg, rgba(74, 163, 255, 0.03), rgba(0, 0, 0, 0.3));
background-size: 100% 100%, 100% 4px, 6px 100%; /* Scanline retro-futuristic grid texture */
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:9999;
overflow:hidden;
animation:fadeOut 0.8s cubic-bezier(0.7, 0, 0.3, 1) 4.6s forwards;
}

/* Atmospheric light flare drifting across the background */
.intro::before{
content:"";
position:absolute;
inset:-50%;
background: radial-gradient(circle at 50% 50%, rgba(74, 163, 255, 0.08) 0%, transparent 60%);
animation: flareDrift 6s ease-in-out infinite alternate;
pointer-events: none;
}

@keyframes flareDrift {
0% { transform: translate(-5%, -5%) scale(0.9); }
100% { transform: translate(5%, 5%) scale(1.1); }
}

/* Dramatic Title: Revealing from blur with a neon shockwave burst */
.intro h1{
font-size:84px;
font-weight: 800;
letter-spacing:14px;
margin:0;
color:#4aa3ff;
text-transform: uppercase;
filter: blur(15px);
text-shadow: 0 0 10px rgba(74, 163, 255, 0.8), 0 0 30px rgba(74, 163, 255, 0.4);
opacity:0;
animation: cinematicReveal 1.6s cubic-bezier(0.1, 0.8, 0.2, 1) 0.3s forwards;
}

/* Subtitles tracking out slowly like classified intelligence entries */
.intro h2{
font-size:24px;
margin-top:20px;
color:#dcdcdc;
font-weight:300;
text-transform: uppercase;
letter-spacing:12px;
opacity:0;
filter: blur(5px);
animation: subtitleReveal 1.4s cubic-bezier(0.1, 0.8, 0.2, 1) 1.5s forwards;
}

.intro p{
font-size:11px;
margin-top:15px;
color:#556985;
letter-spacing:6px;
font-weight: 600;
text-transform: uppercase;
opacity:0;
animation: standardFadeIn 1s ease 2.6s forwards;
}

/* KEYFRAMES FOR CINEMATIC TIMING */
@keyframes cinematicReveal {
0% { opacity: 0; filter: blur(20px); transform: scale(0.92); letter-spacing: 24px; }
40% { opacity: 0.8; filter: blur(5px); }
100% { opacity: 1; filter: blur(0px); transform: scale(1); letter-spacing: 14px; }
}

@keyframes subtitleReveal {
0% { opacity: 0; filter: blur(10px); letter-spacing: 4px; transform: translateY(10px); }
100% { opacity: 1; filter: blur(0px); letter-spacing: 12px; transform: translateY(0); }
}

@keyframes standardFadeIn {
from { opacity: 0; transform: translateY(5px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeOut{
0% { opacity: 1; transform: scale(1); }
100% { opacity: 0; transform: scale(1.03); visibility:hidden; pointer-events:none; }
}

/* ================= MAIN CONTENT ================= */
main{
opacity:0;
animation:show 1.2s cubic-bezier(0.4, 0, 0.2, 1) 4.9s forwards;
height:100vh;
overflow:auto;
}

@keyframes show{to{opacity:1;}}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items: center;
padding:20px 40px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

header b{
color:#fff;
letter-spacing:2px;
text-transform: uppercase;
font-size: 14px;
}

.lang a{
margin-left:15px;
color:#718096;
font-size:12px;
font-weight: bold;
cursor:pointer;
transition: color 0.2s;
text-decoration: none;
}

.lang a:hover{
color:#4aa3ff;
text-shadow: 0 0 8px rgba(74, 163, 255, 0.6);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:20px;
max-width:1200px;
margin:80px auto;
padding:0 20px;
}

/* CARD */
.card{
background:#111827;
padding:25px 20px;
border-radius:12px;
border:1px solid #1f2a3a;
cursor:pointer;
text-align:center;
transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
min-height:120px;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transform:translateY(30px);
animation:cardIn 0.8s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
}

.card:nth-child(1){animation-delay: 5.0s;}
.card:nth-child(2){animation-delay: 5.1s;}
.card:nth-child(3){animation-delay: 5.2s;}
.card:nth-child(4){animation-delay: 5.3s;}
.card:nth-child(5){animation-delay: 5.4s;}

@keyframes cardIn{
to{opacity:1;transform:translateY(0);}
}

.card:hover{
transform:translateY(-8px);
border-color:#4aa3ff;
background:#151f33;
box-shadow:0 12px 30px rgba(74, 163, 255, 0.18);
}

h3{
color:#4aa3ff;
margin:0;
font-size: 16px;
letter-spacing: 0.5px;
line-height: 1.4;
transition: color 0.2s;
}

.card:hover h3 {
color: #fff;
}
</style>
</head>

<body>

<!-- CINEMATIC INTRO CONTAINER -->
<div class="intro">
  <h1>G-Rock Corporation</h1>
  <h2>Monkeys University of Gibraltar</h2>
  <p>G-ROCK PRESENTS // POWERED BY G-SYSTEM</p>
</div>

<!-- MAIN HUB -->
<main>

<header>
<b>G-Rock Corporation // Main Core</b>

<div class="lang">
<a onclick="setLang('en')">EN</a>
<a onclick="setLang('pl')">PL</a>
<a onclick="setLang('es')">ES</a>
<a onclick="setLang('fr')">FR</a>
</div>
</header>

<div class="grid">

<div class="card" onclick="location.href='university.html'">
<h3>Monkeys University of Gibraltar</h3>
</div>

<div class="card" onclick="location.href='bank.html'">
<h3>Bank of the Monkeys from Gibraltar</h3>
</div>

<div class="card" onclick="location.href='parliament.html'">
<h3>Parliament of the Monkeys from Gibraltar</h3>
</div>

<div class="card" onclick="location.href='episode1.html'">
<h3>Episode 1</h3>
</div>

<div class="card" onclick="location.href='map.html'">
<h3>World Map</h3>
</div>

</div>

</main>

<script>
function setLang(lang){
const data = {
en:[
"Monkeys University of Gibraltar",
"Bank of the Monkeys from Gibraltar",
"Parliament of the Monkeys from Gibraltar",
"Episode 1",
"World Map"
],
pl:[
"Uniwersytet Małp Gibraltaru",
"Bank Małp z Gibraltaru",
"Parlament Małp z Gibraltaru",
"Odcinek 1",
"Mapa Świata"
],
es:[
"Universidad de los Monos de Gibraltar",
"Banco de los Monos de Gibraltar",
"Parlamento de los Monos de Gibraltar",
"Episodio 1",
"Mapa del Mundo"
],
fr:[
"Université des Singes de Gibraltar",
"Banque des Singes de Gibraltar",
"Parlement des Singes de Gibraltar",
"Épisode 1",
"Carte du Monde"
]
};

document.querySelectorAll(".grid h3").forEach((el,i)=>{
el.innerText = data[lang][i];
});
}
</script>

</body>
</html>
