<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock State</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

/* ================= INTRO (FILMOWE) ================= */
.intro{
position:fixed;
inset:0;
background:radial-gradient(circle at center,#000 0%,#05070d 60%,#000 100%);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
text-align:center;
animation:fadeOut 4s ease 4s forwards;
}

.intro h1{
font-size:72px;
letter-spacing:8px;
margin:0;
color:#4aa3ff;
text-shadow:0 0 30px rgba(74,163,255,0.5);
opacity:0;
animation:fadeIn 1.2s ease forwards;
}

.intro h2{
font-size:30px;
margin-top:10px;
color:#ddd;
opacity:0;
animation:fadeIn 1.2s ease 0.8s forwards;
font-weight:normal;
letter-spacing:2px;
}

.intro p{
font-size:14px;
margin-top:10px;
color:#888;
opacity:0;
animation:fadeIn 1.2s ease 1.6s forwards;
letter-spacing:2px;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(15px);}
to{opacity:1; transform:translateY(0);}
}

@keyframes fadeOut{
to{opacity:0; visibility:hidden; pointer-events:none;}
}

/* ================= MAIN ================= */
main{
opacity:0;
animation:show 1s ease 4.5s forwards;
height:100vh;
overflow:auto;
}

@keyframes show{
from{opacity:0;}
to{opacity:1;}
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header b{
color:#fff;
letter-spacing:1px;
}

/* LANG */
.lang a{
margin-left:10px;
color:#aaa;
font-size:12px;
cursor:pointer;
transition:0.2s;
}

.lang a:hover{
color:#4aa3ff;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
max-width:1000px;
margin:40px auto;
padding:0 20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2a3a;
cursor:pointer;
text-align:center;
transition:0.25s;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-6px);
}

h3{
color:#4aa3ff;
margin:0;
}

</style>

</head>

<body>

<!-- ================= INTRO (FILMOWE) ================= -->
<div class="intro">
  <h1>G-ROCK STATE</h1>
  <h2>MONKEYS UNIVERSITY OF GIBRALTAR</h2>
  <p>G-ROCK PRESENTS</p>
  <p>POWERED BY G-SYSTEM</p>
</div>

<!-- ================= MAIN SYSTEM ================= -->
<main>

<header>
<b>G-ROCK STATE</b>

<div class="lang">
<a onclick="setLang('en')">EN</a>
<a onclick="setLang('pl')">PL</a>
<a onclick="setLang('es')">ES</a>
<a onclick="setLang('fr')">FR</a>
</div>

</header>

<div class="grid">

<div class="card" onclick="location.href='university.html'">
<h3 data-key="t1">Monkeys University of Gibraltar</h3>
</div>

<div class="card" onclick="location.href='bank.html'">
<h3 data-key="t2">Bank of the Monkeys from Gibraltar</h3>
</div>

<div class="card" onclick="location.href='parliament.html'">
<h3 data-key="t3">Parliament of the Monkeys from Gibraltar</h3>
</div>

<div class="card" onclick="location.href='episode1.html'">
<h3 data-key="t4">Episode 1</h3>
</div>

<div class="card" onclick="location.href='ceuta.html'">
<h3 data-key="t5">Campus de Ceuta</h3>
</div>

<div class="card" onclick="location.href='bridge.html'">
<h3 data-key="t6">Intercontinental Bridge</h3>
</div>

</div>

</main>

<script>

/* ================= LANGUAGE SYSTEM ================= */

const langData = {
en:{
t1:"Monkeys University of Gibraltar",
t2:"Bank of the Monkeys from Gibraltar",
t3:"Parliament of the Monkeys from Gibraltar",
t4:"Episode 1",
t5:"Campus de Ceuta",
t6:"Intercontinental Bridge"
},
pl:{
t1:"Uniwersytet Małp Gibraltaru",
t2:"Bank Małp z Gibraltaru",
t3:"Parlament Małp Gibraltaru",
t4:"Odcinek 1",
t5:"Kampus Ceuta",
t6:"Most Międzykontynentalny"
},
es:{
t1:"Universidad de los Monos de Gibraltar",
t2:"Banco de los Monos de Gibraltar",
t3:"Parlamento de los Monos de Gibraltar",
t4:"Episodio 1",
t5:"Campus de Ceuta",
t6:"Puente Intercontinental"
},
fr:{
t1:"Université des Singes de Gibraltar",
t2:"Banque des Singes de Gibraltar",
t3:"Parlement des Singes de Gibraltar",
t4:"Épisode 1",
t5:"Campus de Ceuta",
t6:"Pont Intercontinental"
}
};

function setLang(l){
document.querySelectorAll("[data-key]").forEach(el=>{
let key = el.getAttribute("data-key");
el.innerText = langData[l][key];
});
}

</script>

</body>
  </html>
