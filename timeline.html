            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(0,240,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.025) 1px, transparent 1px);

            scroll-behavior: smooth;
        }
        .navbar {

            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding: 16px 4%;
            background: rgba(3,7,18,.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
        }
        .nav-left { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
        .return-hub {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: rgba(11,17,32,.7);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            transition: .3s;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .return-hub:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,240,255,.25); }
        .nav-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .lang-switch {
            display: flex;
            gap: 5px;
            background: rgba(11,17,32,.7);
            padding: 5px;
            border-radius: 8px;
            border: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .lang-switch a {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            transition: .2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .lang-switch a:hover, .lang-switch a.active {
            color: #1c1300;
            background: linear-gradient(135deg, var(--brass-bright), var(--brass1));
            box-shadow: 0 0 14px rgba(163,112,44,.5);
        }
        .main-header {
            position: relative;
            padding: 60px 4% 30px;
            text-align: center;
            overflow: hidden;
            background: rgba(3,7,18,0.5);
            border-bottom: 1px solid var(--line);
        }
        .brass-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: clamp(28px, 4vw, 48px);
            text-transform: uppercase;
            line-height: 1.2;
            background: linear-gradient(180deg, var(--brass-bright) 0%, var(--brass1) 45%, var(--brass2) 75%, var(--brass3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 0 #1a0f00) drop-shadow(0 4px 12px rgba(0,0,0,.8));
            margin-bottom: 10px;
        }
        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 4%;
            background: rgba(3,7,18,0.7);
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
            position: sticky;
            top: 73px;
            z-index: 900;
            backdrop-filter: blur(10px);
        }
        .filter-btn {
            background: var(--panel-solid);
            border: 1px solid var(--line);
            color: var(--light);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;

            font-size: 11px;

            background: rgba(0,240,255,0.08);

            border-color: var(--brass-bright);
            box-shadow: 0 16px 38px rgba(201,146,42,0.3);
        }

        .event-title { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #fff; margin-top: 6px; letter-spacing: 0.5px; }

        .event-layer { font-size: 13.5px; padding: 12px 16px; border-radius: 8px; border-left: 3px solid; line-height: 1.6; }
        .layer-history { border-color: #6b7c93; background: rgba(107, 124, 147, 0.08); color: var(--light); }
        .layer-folklore { border-color: #ff9500; background: rgba(255, 149, 0, 0.08); color: #ffd699; }

        .layer-grock { border-color: var(--cyan); background: rgba(0, 240, 255, 0.08); color: #b3f8ff; }
        .info-panel {
            margin-top: 50px;
            background: var(--panel);
            backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 14px 40px rgba(0,0,0,.5);

            color: var(--brass-bright);

            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;

        footer {

            padding: 50px 4%;
            border-top: 1px solid var(--line);
            margin-top: 80px;
            background: rgba(3,7,18,0.9);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .footer-link:hover { color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6); }
    </style>
</head>

        const translations = {

                grock: "G-ROCK ERA",
                p1Title: "REAL FOLKLORE OF THE ROCK",
                p1Content: `<p><strong>THE MAPS OF GIBRALTAR AND THE MONKEYS:</strong> One of the longstanding legends associated with Gibraltar concerns the maps of Gibraltar and the Barbary macaques. According to the traditional story, the presence of the monkeys became connected with the belief that Britain would retain Gibraltar as long as monkeys remained on the Rock. The legend is often expressed through the idea that if the monkeys disappeared from Gibraltar, Britain would eventually lose Gibraltar.</p><p><strong>THE MAP LEGEND:</strong> According to the traditional account, the story became associated with the idea that the presence of the monkeys was effectively part of the condition determining the future of British Gibraltar.</p><p><strong>POSSIBLE ORIGIN — A JOKE ON THE SPANISH SIDE:</strong> According to one traditional explanation, the legend may have begun as a joke on the Spanish side of Gibraltar. The joke referred humorously to the British possession and connected the continued presence of Britain with the continued presence of the monkeys. <em>Archive Note:</em> Treated as a traditional folkloric explanation, not established historical fact.</p><p><strong>ST MICHAEL'S CAVE:</strong> A traditional legend says that the monkeys reached Gibraltar from North Africa through an underground passage connected with St Michael's Cave and the African coast.</p><p><strong>THE MONKEYS AS WATCHMEN:</strong> Tradition connects the macaques with the defence of the Rock, including stories that their behaviour alerted the British garrison to danger.</p>`,
                p2Title: "G-SYSTEM — CANONICAL ARCHIVE INTELLIGENCE",
                p2Content: `<p><strong>WHAT IS THE G-SYSTEM:</strong> The G-System is the foundational classification, verification, and intelligence engine governing the entire G-ROCK Archive. It ensures strict ontological boundaries between historical facts, independent local folklore, author fiction, and contemporary project data.</p><p><strong>THE PRIMARY RULE:</strong> Total separation of narrative layers. Historical facts, real local folklore, author fiction, and project data must never be automatically conflated or blurred.</p><p><strong>G-SYSTEM OPERATING MODEL (L0–L5):</strong> • <strong>L0 (Ingestion):</strong> Raw data collection from historical records, oral folklore, and author logs. • <strong>L1 (Parsing):</strong> Lexical extraction and metadata tagging. • <strong>L2 (Cross-Reference):</strong> Verification against institutional archives and cross-layer parameters. • <strong>L3 (Ontological Filtering):</strong> Separation into distinct historical, folkloric, and fictional silos. • <strong>L4 (Canonical Synthesis):</strong> Integration into the core database structure. • <strong>L5 (Security & Telemetry):</strong> Final operational lock and tamper-proof distribution.</p><p><strong>CANON STATES (S0–S3):</strong> • <strong>S0 (Raw):</strong> Unverified input items. • <strong>S1 (Preliminary):</strong> Initial metadata alignment. • <strong>S2 (Canonical Verified):</strong> Fully audited and authenticated records. • <strong>S3 (Core Immutable Axiom):</strong> Permanent foundational archive truths.</p><p><strong>G-SYSTEM ANOMALY ENGINE & ANOMALY TYPES (A–D):</strong> • <strong>Type A (Chronological Drift):</strong> Time-vector discrepancies between official history and hidden logs. • <strong>Type B (Layer Contamination):</strong> Blurring lines between folklore and historical documentation. • <strong>Type C (Fictional Infiltration):</strong> Unauthorized leakage of author fiction into factual baselines. • <strong>Type D (Structural Paradox):</strong> Logical inconsistencies within multi-campus nodes.</p><p><strong>EXAMPLE — PROFESSOR SUGRIVA:</strong> Canonical test case linking institutional university acceptance records in Britain (January 2025), historical AI research history, and multi-layered fictional integration within the Monkey University of Gibraltar (MUOG) network.</p><p><strong>G-SYSTEM PRIME DIRECTIVE:</strong> Uncompromising preservation of institutional memory, multi-layered truth isolation, and systemic integrity across the entire G-ROCK digital ecosystem.</p><p><strong>FINAL G-SYSTEM FORMULA:</strong> Ω = Σ (History ⊕ Folklore ⊕ Fiction) × Integrity — the algorithmic and logical synthesis binding operational nodes into a unified archival output.</p><p><strong>G-SYSTEM CORE FUNCTION:</strong> Continuous execution of self-auditing routines, cryptographic verification, cross-layer integrity maintenance, and telemetry logging.</p>`,
                p3Title: "ARCHIVE CLASSIFICATION",
                p3Content: `<p><strong>HISTORY:</strong> Documented historical events.</p><p><strong>REAL FOLKLORE / LEGEND:</strong> Traditional Gibraltar legends and folklore that existed independently from the author's fictional universe.</p><p><strong>AUTHOR FICTION:</strong> Fictional events, institutions, characters and connections created by the author as part of the MUOG / The Monkeys universe.</p><p><strong>FACT / G-ROCK ERA:</strong> Documented contemporary events belonging to the G-ROCK project history.</p>`,
                copy: "G-ROCK ARCHIVE © 2026. All rights reserved.",
                notice: "All content within the G-ROCK archive, including narrative structures, characters (Wojtek, Professor Sugriva, The Monkeys), institutions (MUOG, Campus, G-ROCK Corporation), classification systems, and the G-SYSTEM, is protected intellectual property. Unauthorized copying, distribution, or commercial use is strictly prohibited.",

                returnBtn: "← POWRÓT DO ARCHIWUM",
                all: "WSZYSTKIE",
                history: "HISTORIA",
                folklore: "PRAWDZIWY FOLKLOR",
                monkeys: "FIKCJA AUTORA",
                grock: "ERA G-ROCK",
                p1Title: "PRAWDZIWY FOLKLOR SKAŁY",
                p1Content: `<p><strong>MAPY GIBRALTARU I MAŁPY:</strong> Jedna z wieloletnich legend związanych z Gibraltarem dotyczy map Gibraltaru i makaków berberyjskich. Według tradycyjnej opowieści obecność małp wiązała się z przekonaniem, że Brytania zachowa Gibraltar tak długo, jak długo małpy pozostaną na Skale. Legenda jest często wyrażana poprzez ideę, że gdyby małpy zniknęły z Gibraltaru, Brytania ostatecznie straciłaby Gibraltar.</p><p><strong>LEGENDA MAPY:</strong> Zgodnie z tradycyjnym przekazem historia ta została powiązana z poglądem, że obecność małp była de facto częścią warunku decydującego o przyszłości brytyjskiego Gibraltaru.</p><p><strong>MOŻLIWE ŹRÓDŁO — ŻART PO HISZPAŃSKIEJ STRONIE:</strong> Według jednego z tradycyjnych wyjaśnień legenda mogła zacząć się jako żart po hiszpańskiej stronie Gibraltaru. Żart ten odnosił się w humorystyczny sposób do posiadłości brytyjskiej i łączył dalszą obecność Brytanii z dalszą obecnością małp. <em>Notatka archiwalna:</em> Traktowane jako tradycyjne wyjaśnienie folklorystyczne, a nie ustalony fakt historyczny.</p><p><strong>JASKINIA ŚW. MICHAŁA:</strong> Tradycyjna legenda głosi, że małpy dotarły na Gibraltar z Afryki Północnej podziemnym przejściem połączonym z Jaskinią św. Michała a wybrzeżem afrykańskim.</p><p><strong>MAŁPY JAKO STRAŻNICY:</strong> Tradycja łączy makaki z obroną Skały, w tym opowieści o tym, że ich zachowanie ostrzegało brytyjski garnizon przed niebezpieczeństwem.</p>`,
                p2Title: "G-SYSTEM — KANONICZNA INTELIGENCJA ARCHIWUM",
                p2Content: `<p><strong>CZYM JEST G-SYSTEM:</strong> G-System to fundamentalny silnik klasyfikacji, weryfikacji i inteligencji zarządzający całym Archiwum G-ROCK. Zapewnia ścisłe granice ontologiczne między faktami historycznymi, niezależnym lokalnym folklorem, fikcją autorską a współczesnymi danymi projektowymi.</p><p><strong>ZASADA GŁÓWNA:</strong> Całkowite oddzielenie warstw narracyjnych. Fakty historyczne, prawdziwy lokalny folklor, fikcja autorska i dane projektowe nigdy nie mogą być automatycznie łączone lub zacierane.</p><p><strong>MODEL OPERACYJNY G-SYSTEMU (L0–L5):</strong> • <strong>L0 (Pozyskiwanie):</strong> Zbieranie surowych danych z zapisów historycznych, folkloru ustnego i dzienników autora. • <strong>L1 (Parsowanie):</strong> Ekstrakcja leksykalna i tagowanie metadanych. • <strong>L2 (Odnośniki krzyżowe):</strong> Weryfikacja względem archiwów instytucjonalnych i parametrów wielowarstwowych. • <strong>L3 (Filtrowanie ontologiczne):</strong> Podział na osobne silosy historyczne, folklorystyczne i fikcyjne. • <strong>L4 (Synteza kanoniczna):</strong> Integracja z główną strukturą bazy danych. • <strong>L5 (Bezpieczeństwo i telemetria):</strong> Ostateczna blokada operacyjna i dystrybucja odporna na manipulacje.</p><p><strong>STANY KANONICZNE (S0–S3):</strong> • <strong>S0 (Surowy):</strong> Niezweryfikowane elementy wejściowe. • <strong>S1 (Wstępny):</strong> Początkowe dopasowanie metadanych. • <strong>S2 (Zweryfikowany kanonicznie):</strong> W pełni audytowane i uwierzytelnione rekordy. • <strong>S3 (Główny aksjomat niezmienny):</strong> Stałe, fundamentalne prawdy archiwalne.</p><p><strong>SILNIK ANOMALII G-SYSTEMU I TYPY ANOMALII (A–D):</strong> • <strong>Typ A (Dryf chronologiczny):</strong> Rozbieżności wektorów czasowych między oficjalną historią a ukrytymi logami. • <strong>Typ B (Kontaminacja warstw):</strong> Zacieranie granic między folklorem a dokumentacją historyczną. • <strong>Typ C (Infiltracja fikcyjna):</strong> Nieaut                 p1Title: "FOLCLORE REAL DEL PEÑÓN",
                p1Content: `<p><strong>LOS MAPAS DE GIBRALTAR Y LOS MONOS:</strong> Una de las leyendas más antiguas asociadas con Gibraltar se refiere a los mapas de Gibraltar y los macacos de Berbería. Según la historia tradicional, la presencia de los monos se vinculó con la creencia de que Gran Bretaña conservaría Gibraltar mientras hubiera monos en el Peñón. La leyenda se expresa a menudo a través de la idea de que si los monos desaparecieran de Gibraltar, Gran Bretaña eventualmente perdería Gibraltar.</p><p><strong>LA LEYENDA DEL MAPA:</strong> Según el relato tradicional, la historia se asoció con la idea de que la presencia de los monos formaba parte de la condición que determinaba el futuro del Gibraltar británico.</p><p><strong>POSIBLE ORIGEN — UNA BROMA EN EL LADO ESPAÑOL:</strong> Según una explicación tradicional, la leyenda pudo haber comenzado como una broma en el lado español de Gibraltar. La broma se refería humorísticamente a la posesión británica y conectaba la presencia continua de Gran Bretaña con la presencia continua de los monos. <em>Nota de archivo:</em> Se trata como una explicación folclórica tradicional, no como un hecho histórico establecido.</p><p><strong>CUEVA DE SAN MIGUEL:</strong> Una leyenda tradicional dice que los monos llegaron a Gibraltar desde el norte de África a través de un pasaje subterráneo conectado con la Cueva de San Miguel y la costa africana.</p><p><strong>LOS MONOS COMO VIGÍAS:</strong> La tradición conecta a los macacos con la defensa del Peñón, incluyendo historias de que su comportamiento alertaba a la guarnición británica sobre el peligro.</p>`,

                p1Title: "FOLKLORE RÉEL DU ROCHER",
                p1Content: `<p><strong>LES CARTES DE GIBRALTAR ET LES SINGES :</strong> L'une des plus anciennes légendes associées à Gibraltar concerne les cartes de Gibraltar et les macaques de Barbarie. Selon l'histoire traditionnelle, la présence des singes a été liée à la croyance selon laquelle la Grande-Bretagne conserverait Gibraltar tant que des singes resteraient sur le Rocher. La légende est souvent exprimée par l'idée que si les singes disparaissaient de Gibraltar, la Grande-Bretagne finirait par perdre Gibraltar.</p><p><strong>LA LÉGENDE DE LA CARTE :</strong> Selon le récit traditionnel, l'histoire a été associée à l'idée que la présence des singes faisait effectivement partie de la condition déterminant l'avenir du Gibraltar britannique.</p><p><strong>ORIGINE POSSIBLE — UNE PLAISANTERIE DU CÔTÉ ESPAGNOL :</strong> Selon une explication traditionnelle, la légende a peut-être commencé comme une blague du côté espagnol de Gibraltar. La blague faisait référence de manière humoristique à la possession britannique et reliait la présence continue de la Grande-Bretagne à la présence continue des singes. <em>Note d'archives :</em> Traité comme une explication folklorique traditionnelle, et non comme un fait historique avéré.</p><p><strong>GROTTE DE SAINT-MICHEL :</strong> Une légende traditionnelle raconte que les singes ont atteint Gibraltar depuis l'Afrique du Nord par un passage souterrain relié à la grotte de Saint-Michel et à la côte africaine.</p><p><strong>LES SINGES EN TANT QUE GARDIENS :</strong> La tradition relie les macaques à la défense du Rocher, y compris des histoires selon lesquelles leur comportement a alerté la garnison britannique d'un danger.</p>`,

                p1Title: "НАСТОЯЩИЙ ФОЛЬКЛОР СКАЛЫ",
                p1Content: `<p><strong>КАРТЫ ГИБРАЛТАРА И ОБЕЗЬЯНЫ:</strong> Одна из давних легенд, связанных с Гибралтаром, касается карт Гибралтара и берберских макак. Согласно традиционному рассказу, присутствие обезьян стало связано с убеждением, что Британия сохранит Гибралтар, пока обезьяны остаются на Скале. Легенда часто выражается через идею о том, что если обезьяны исчезнут из Гибралтара, Британия в конечном итоге потеряет Гибралтар.</p><p><strong>ЛЕГЕНДА О КАРТЕ:</strong> Согласно традиционному рассказу, история стала ассоциироваться с идеей о том, что присутствие обезьян фактически было частью условия, определяющего будущее британского Гибралтара.</p><p><strong>ВОЗМОЖНОЕ ПРОИСХОЖДЕНИЕ — ШУТКА НА ИСПАНСКОЙ СТОРОНЕ:</strong> Согласно одному из традиционных объяснений, легенда могла начаться как шутка на испанской стороне Гибралтара. Шутка юмористически относилась к британскому владению и связывала непрерывное присутствие Британии с непрерывным присутствием обезьян. <em>Архивная заметка:</em> Рассматривается как традиционное фольклорное объяснение, а не установленный исторический факт.</p><p><strong>ПЕЩЕРА СВЯТОГО МИХАИЛА:</strong> Традиционная легенда гласит, что обезьяны достигли Гибралтара из Северной Африки через подземный проход, соединенный с пещерой Святого Михаила и африканским побережьем.</p><p><strong>ОБЕЗЬЯНЫ КАК СТОРОЖА:</strong> Традиция связывает макак с обороной Скалы, включая истории о том, что их поведение предупреждало британский гарнизон об опасности.</p>`,

        function renderTimeline(lang = 'en') {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            const groupedByEra = {};
            timelineData.forEach(event => {
                if (!groupedByEra[event.eraId]) {
                    groupedByEra[event.eraId] = {
                        era: event.era,
                        period: event.period,
                        events: []
                    };
                }
                groupedByEra[event.eraId].events.push(event);
            });
            
            Object.values(groupedByEra).forEach(eraData => {
                const eraDiv = document.createElement('div');
                eraDiv.className = 'timeline-era';
                eraDiv.innerHTML = `
                    <div class="era-header">
                        <div class="era-label">ERA</div>
                        <h2>${eraData.era}</h2>
                        <div class="era-period">${eraData.period}</div>
                    </div>
                    <div class="timeline-grid">
                        ${eraData.events.map(event => `
                            <article class="timeline-card ${event.featured ? 'timeline-card--featured' : ''}" data-type="${event.categories[0]}">
                                <div class="event-header">
                                    <div class="event-year">${event.year}</div>
                                    <div class="event-title">${event.title[lang] || event.title.en}</div>
                                </div>
                                <div class="event-content">
                                    ${event.layers.history ? `<div class="event-layer layer-history">${event.layers.history[lang] || event.layers.history.en}</div>` : ''}
                                    ${event.layers.folklore ? `<div class="event-layer layer-folklore">${event.layers.folklore[lang] || event.layers.folklore.en}</div>` : ''}
                                    ${event.layers.monkeys ? `<div class="event-layer layer-monkeys">${event.layers.monkeys[lang] || event.layers.monkeys.en}</div>` : ''}
                                    ${event.layers.grock ? `<div class="event-layer layer-grock">${event.layers.grock[lang] || event.layers.grock.en}</div>` : ''}
                                </div>
                            </article>
                        `).join('')}
                    </div>
                `;
                container.appendChild(eraDiv);
            });
        }

        function renderIndex() {
            const index = document.getElementById('timeline-index');
            const seenEras = new Set();
            const uniqueEras = [];
            
            timelineData.forEach(event => {
                if (!seenEras.has(event.eraId)) {
                    seenEras.add(event.eraId);
                    uniqueEras.push({ id: event.eraId, era: event.era, period: event.period });
                }
            });
            
            index.innerHTML = uniqueEras.map(era => 
                `<a href="#" class="index-link" onclick="scrollToEra('${era.id}'); return false;">${era.era} ${era.period}</a>`
            ).join('');
        }

        function scrollToEra(eraId) {
            const eraElement = document.querySelector(`[data-era-id="${eraId}"]`) || 
                               Array.from(document.querySelectorAll('.timeline-era')).find(el => 
                                   el.querySelector('h2') && el.querySelector('h2').textContent.includes(eraId.replace('era-', ''))
                               );
            if (eraElement) {
                eraElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function setLang(lang) {
            document.querySelectorAll('.lang-switch a').forEach(a => a.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');
            
            const t = translations[lang] || translations.en;
            
            document.getElementById('return-btn').textContent = t.returnBtn;
            document.getElementById('btn-all').textContent = t.all;
            document.getElementById('btn-history').textContent = t.history;
            document.getElementById('btn-folklore').textContent = t.folklore;
            document.getElementById('btn-monkeys').textContent = t.monkeys;
            document.getElementById('btn-grock').textContent = t.grock;
            
            document.getElementById('p1-title').textContent = t.p1Title;
            document.getElementById('p1-content').innerHTML = t.p1Content;
            
            document.getElementById('p2-title').textContent = t.p2Title;
            document.getElementById('p2-content').innerHTML = t.p2Content;
            
            document.getElementById('p3-title').textContent = t.p3Title;
            document.getElementById('p3-content').innerHTML = t.p3Content;
            
            document.getElementById('footer-copy').textContent = t.copy;
            document.getElementById('footer-notice-text').textContent = t.notice;
            document.getElementById('footer-status-text').textContent = t.status;
            document.getElementById('link-hub').textContent = t.hub;
            document.getElementById('link-archive').textContent = t.archive;
            
            renderTimeline(lang);
            renderIndex();
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                document.querySelectorAll('.timeline-card').forEach(card => {
                    if (filter === 'all' || card.dataset.type === filter) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setLang('en');
        });
    </script>
