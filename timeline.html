            --panel: rgba(15,23,42,.55);
            --panel-solid: #0b1120;
            --line: rgba(163,112,44,.28);
            --brass1: #a3702c;
            --brass2: #684a06;
            --brass3: #3d2b03;
            --brass-bright: #c9922a;
            --cyan: #00f0ff;
            --text: #dbe3ee;
            --muted: #6b7c93;
            --light: #aebdd1;
            --glow-gold: 0 0 15px rgba(201, 146, 42, 0.4);

        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(0,240,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.025) 1px, transparent 1px);
            background-size: 34px 34px;
            scroll-behavior: smooth;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding: 16px 4%;
            background: rgba(3,7,18,.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--line);
        }
        .nav-left { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
        .return-hub {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: rgba(11,17,32,.7);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            transition: .3s;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .return-hub:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,240,255,.25); }
        .nav-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .lang-switch {
            display: flex;
            gap: 5px;
            background: rgba(11,17,32,.7);
            padding: 5px;
            border-radius: 8px;
            border: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .lang-switch a {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
            transition: .2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .lang-switch a:hover, .lang-switch a.active {
            color: #1c1300;
            background: linear-gradient(135deg, var(--brass-bright), var(--brass1));
            box-shadow: 0 0 14px rgba(163,112,44,.5);
        }
        .main-header {
            position: relative;
            padding: 60px 4% 30px;
            text-align: center;
            overflow: hidden;
            background: rgba(3,7,18,0.5);
            border-bottom: 1px solid var(--line);
        }
        .brass-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: clamp(28px, 4vw, 48px);
            text-transform: uppercase;
            line-height: 1.2;
            background: linear-gradient(180deg, var(--brass-bright) 0%, var(--brass1) 45%, var(--brass2) 75%, var(--brass3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 0 #1a0f00) drop-shadow(0 4px 12px rgba(0,0,0,.8));
            margin-bottom: 10px;
        }
        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 4%;
            background: rgba(3,7,18,0.7);
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
            position: sticky;
            top: 73px;
            z-index: 900;
            backdrop-filter: blur(10px);
        }
        .filter-btn {
            background: var(--panel-solid);
            border: 1px solid var(--line);
            color: var(--light);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(0,240,255,0.08);
            box-shadow: 0 0 12px rgba(0,240,255,0.25);
        }
        .timeline-index {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 15px 4%;
            background: rgba(11,17,32,0.8);
            white-space: nowrap;
            border-bottom: 1px solid var(--line);

        .index-link {
            font-family: 'Orbitron', sans-serif;
            color: var(--brass-bright);
            text-decoration: none;
            font-size: 11px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--line);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

            background: var(--panel);

            gap: 16px;

            border-color: var(--cyan);
            background: rgba(0,240,255,0.03);
            box-shadow: 0 14px 34px rgba(0,240,255,0.15);

            border-color: var(--brass1);

            border-color: var(--brass-bright);
            box-shadow: 0 16px 38px rgba(201,146,42,0.3);
        }

            box-shadow: 0 0 25px rgba(0,240,255,0.5) !important;

        .event-layer { font-size: 13.5px; padding: 12px 16px; border-radius: 8px; border-left: 3px solid; line-height: 1.6; }
        .layer-fiction { border-color: #9d4edd; background: rgba(157, 78, 221, 0.08); color: #e0aaff; }
        .layer-fact { border-color: #6b7c93; background: rgba(107, 124, 147, 0.08); color: var(--light); }
        .layer-folklore { border-color: #ff9500; background: rgba(255, 149, 0, 0.08); color: #ffd699; }
        .layer-anomaly { border-color: #ff0000; background: rgba(255, 0, 0, 0.08); color: #ff9999; }
        .info-panel {
            margin-top: 50px;
            background: var(--panel);
            backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 14px 40px rgba(0,0,0,.5);
        }
        .info-panel h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--brass-bright);
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
        }
        .info-content { display: flex; flex-direction: column; gap: 16px; font-size: 14px; color: var(--light); line-height: 1.75; }
        .info-content strong { color: #fff; font-family: 'Orbitron', sans-serif; font-size: 13px; }
        .layer-label {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .label-fiction { background: #9d4edd; color: #ffffff; }
        .label-fact { background: #ffffff; color: #000000; }
        .label-folklore { background: #ffd700; color: #000000; }
        .label-anomaly { background: #ff0000; color: #ffffff; }
        footer {

            padding: 50px 4%;
            border-top: 1px solid var(--line);
            margin-top: 80px;
            background: rgba(3,7,18,0.9);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .footer-status { margin: 15px 0; color: var(--cyan); font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,240,255,0.4); }

        .footer-link:hover { color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6); }
    </style>
</head>

                p1Title: "REAL FOLKLORE OF THE ROCK",
                p1Content: `<p><strong>GIBRALTAR MAPS AND MONKEYS:</strong> One of the long-standing legends associated with Gibraltar concerns the Gibraltar maps and Barbary macaques. According to the traditional story, the presence of the monkeys became linked to the belief that Britain would retain Gibraltar as long as monkeys remained on the Rock. The legend is often expressed through the idea that if the monkeys were to disappear from Gibraltar, Britain would eventually lose Gibraltar.</p><p><strong>THE MAP LEGEND:</strong> According to the traditional account, the story became associated with the idea that the presence of the monkeys was effectively part of the condition determining the future of British Gibraltar.</p><p><strong>POSSIBLE ORIGIN — A JOKE ON THE SPANISH SIDE:</strong> According to one traditional explanation, the legend may have begun as a joke on the Spanish side of Gibraltar. The joke referred humorously to the British possession and linked the continued presence of Britain with the continued presence of the monkeys. <em>Archival note:</em> Treated as a traditional folkloric explanation, not an established historical fact.</p><p><strong>ST. MICHAEL'S CAVE:</strong> A traditional legend says that the monkeys reached Gibraltar from North Africa via an underground passage connected to St. Michael's Cave and the African coast.</p><p><strong>MONKEYS AS GUARDIANS:</strong> Tradition connects the macaques with the defense of the Rock, including stories that their behavior alerted the British garrison to danger.</p><p><strong>BRINGING MONKEYS FROM AFRICA / WINSTON CHURCHILL:</strong> Among Gibraltar residents circulates the tradition that Winston Churchill allegedly gave the order to bring monkeys from Africa. Some historians repeat this thesis. However, there is no confirmed document or Churchill order confirming this thesis. <em>Archival note:</em> Treated as local tradition/folklore, not an established historical fact.</p>`,
                p2Title: "G-SYSTEM — CANONICAL ARCHIVE INTELLIGENCE",
                p2Content: `<p><strong>WHAT IS G-SYSTEM:</strong> G-System is the fundamental classification, verification, and intelligence engine governing the entire G-ROCK Archive. It ensures strict ontological boundaries between historical facts, independent local folklore, author fiction, and contemporary project data.</p><p><strong>THE PRIMARY RULE:</strong> Total separation of narrative layers. Historical facts, real local folklore, author fiction, and project data must never be automatically merged or blurred.</p><p><strong>G-SYSTEM OPERATIONAL MODEL (L0–L5):</strong> • <strong>L0 (Ingestion):</strong> Raw data collection from historical records, oral folklore, and author logs. • <strong>L1 (Parsing):</strong> Lexical extraction and metadata tagging. • <strong>L2 (Cross-Reference):</strong> Verification against institutional archives and cross-layer parameters. • <strong>L3 (Ontological Filtering):</strong> Separation into distinct historical, folkloric, and fictional silos. • <strong>L4 (Canonical Synthesis):</strong> Integration into the core database structure. • <strong>L5 (Security & Telemetry):</strong> Final operational lockdown and tamper-resistant distribution.</p><p><strong>CANON STATES (S0–S3):</strong> • <strong>S0 (Raw):</strong> Unverified input items. • <strong>S1 (Preliminary):</strong> Initial metadata alignment. • <strong>S2 (Canonically Verified):</strong> Fully audited and authenticated records. • <strong>S3 (Core Immutable Axiom):</strong> Permanent foundational archive truths.</p><p><strong>G-SYSTEM ANOMALY ENGINE & ANOMALY TYPES (A–D):</strong> • <strong>Type A (Chronological Drift):</strong> Time vector discrepancies between official history and hidden logs. • <strong>Type B (Layer Contamination):</strong> Blurring of boundaries between folklore and historical documentation. • <strong>Type C (Fictional Infiltration):</strong> Unauthorized leakage of author fiction into factual baselines. • <strong>Type D (Structural Paradox):</strong> Logical inconsistencies within multi-campus nodes.</p><p><strong>EXAMPLE — PROFESSOR SUGRIVA:</strong> Canonical test case linking institutional university acceptance records in Britain (January 2025), historical AI research history, and multi-layer fictional integration within the Monkey University of Gibraltar (MUOG) network.</p><p><strong>G-SYSTEM FIRST DIRECTIVE:</strong> Uncompromising preservation of institutional memory, multi-layer truth isolation, and systemic integrity throughout the G-ROCK digital ecosystem.</p><p><strong>FINAL G-SYSTEM FORMULA:</strong> Ω = Σ (History ⊕ Folklore ⊕ Fiction) × Integrity — the algorithmic and logical synthesis binding operational nodes into a unified archive output.</p><p><strong>G-SYSTEM CORE FUNCTION:</strong> Continuous execution of self-audit routines, cryptographic verification, cross-layer integrity maintenance, and telemetry logging.</p><p><strong>G-SYSTEM CLASSIFICATION COHERENCE:</strong> • <strong>ANOMALY</strong> is an independent classification status. • ANOMALY can coexist with other categories, e.g. <strong>FACT + ANOMALY</strong>, <strong>HISTORY + ANOMALY</strong> or <strong>G-ROCK ERA + ANOMALY</strong>. • ANOMALY does not automatically turn an event into AUTHOR FICTION. • <strong>AUTHOR FICTION</strong> remains a separate category. • <strong>REAL FOLKLORE / LEGEND</strong> remains a separate category. • <strong>FACT</strong> and <strong>ANOMALY</strong> can simultaneously describe two different aspects of the same event. • Individual G-System layers cannot change the meaning of other layers. • Classification must be coherent throughout the timeline.</p>`,
                p3Title: "ARCHIVE CLASSIFICATION",
                p3Content: `<p><strong>FACT:</strong> Documented historical and contemporary events.</p><p><strong>REAL FOLKLORE / LEGEND:</strong> Traditional Gibraltar legends and folklore that existed independently of the author's fictional universe.</p><p><strong>AUTHOR FICTION:</strong> Fictional events, institutions, characters, and connections created by the author as part of the MUOG / The Monkeys universe.</p><p><strong>ANOMALY:</strong> Independent classification status that can coexist with other categories, e.g. FACT + ANOMALY. ANOMALY does not automatically turn an event into AUTHOR FICTION.</p>`,
                copy: "G-ROCK ARCHIVE © 2026. All rights reserved.",
                notice: "All content within the G-ROCK archive, including narrative structures, characters (Wojtek, Professor Sugriva, The Monkeys), institutions (MUOG, Campus, G-ROCK Corporation), classification systems and the G-SYSTEM, is protected intellectual property. Unauthorized copying, distribution, or commercial use is strictly prohibited.",

            pl: {
                returnBtn: "← POWRÓT DO ARCHIWUM",
                all: "WSZYSTKIE",
                fiction: "FIKCJA AUTORA",
                folklore: "PRAWDZIWY FOLKLOR",
                fact: "FAKT",
                anomaly: "ANOMALIA",
                p1Title: "PRAWDZIWY FOLKLOR SKAŁY",
                p1Content: `<p><strong>MAPY GIBRALTARU I MAŁPY:</strong> Jedna z wieloletnich legend związanych z Gibraltarem dotyczy map Gibraltaru i makaków berberyjskich. Według tradycyjnej opowieści obecność małp wiązała się z przekonaniem, że Brytania zachowa Gibraltar tak długo, jak długo małpy pozostaną na Skale. Legenda jest często wyrażana poprzez ideę, że gdyby małpy zniknęły z Gibraltaru, Brytania ostatecznie straciłaby Gibraltar.</p><p><strong>LEGENDA MAPY:</strong> Zgodnie z tradycyjnym przekazem historia ta została powiązana z poglądem, że obecność małp była de facto częścią warunku decydującego o przyszłości brytyjskiego Gibraltaru.</p><p><strong>MOŻLIWE ŹRÓDŁO — ŻART PO HISZPAŃSKIEJ STRONIE:</strong> Według jednego z tradycyjnych wyjaśnień legenda mogła zacząć się jako żart po hiszpańskiej stronie Gibraltaru. Żart ten odnosił się w humorystyczny sposób do posiadłości brytyjskiej i łączył dalszą obecność Brytanii z dalszą obecnością małp. <em>Notatka archiwalna:</em> Traktowane jako tradycyjne wyjaśnienie folklorystyczne, a nie ustalony fakt historyczny.</p><p><strong>JASKINIA ŚW. MICHAŁA:</strong> Tradycyjna legenda głosi, że małpy dotarły na Gibraltar z Afryki Północnej podziemnym przejściem połączonym z Jaskinią św. Michała a wybrzeżem afrykańskim.</p><p><strong>MAŁPY JAKO STRAŻNICY:</strong> Tradycja łączy makaki z obroną Skały, w tym opowieści o tym, że ich zachowanie ostrzegało brytyjski garnizon przed niebezpieczeństwem.</p><p><strong>SPROWADZENIE MAŁP Z AFRYKI / WINSTON CHURCHILL:</strong> Wśród mieszkańców Gibraltaru funkcjonuje przekaz, że Winston Churchill miał wydać rozkaz sprowadzenia małp z Afryki. Niektórzy historycy powtarzają tę tezę. Jednak nie istnieje potwierdzony dokument ani rozkaz Churchilla, który potwierdzałby tę tezę. <em>Notatka archiwalna:</em> Traktowane jako lokalny przekaz/folklor, a nie ustalony fakt historyczny.</p>`,

                p1Title: "FOLCLORE REAL DEL PEÑÓN",
                p1Content: `<p><strong>LOS MAPAS DE GIBRALTAR Y LOS MONOS:</strong> Una de las leyendas más antiguas asociadas con Gibraltar se refiere a los mapas de Gibraltar y los macacos de Berbería. Según la historia tradicional, la presencia de los monos se vinculó con la creencia de que Gran Bretaña conservaría Gibraltar mientras hubiera monos en el Peñón. La leyenda se expresa a menudo a través de la idea de que si los monos desaparecieran de Gibraltar, Gran Bretaña eventualmente perdería Gibraltar.</p><p><strong>LA LEYENDA DEL MAPA:</strong> Según el relato tradicional, la historia se asoció con la idea de que la presencia de los monos formaba parte de la condición que determinaba el futuro del Gibraltar británico.</p><p><strong>POSIBLE ORIGEN — UNA BROMA EN EL LADO ESPAÑOL:</strong> Según una explicación tradicional, la leyenda pudo haber comenzado como una broma en el lado español de Gibraltar. La broma se refería humorísticamente a la posesión británica y conectaba la presencia continua de Gran Bretaña con la presencia continua de los monos. <em>Nota de archivo:</em> Se trata como una explicación folclórica tradicional, no como un hecho histórico establecido.</p><p><strong>CUEVA DE SAN MIGUEL:</strong> Una leyenda tradicional dice que los monos llegaron a Gibraltar desde el norte de África a través de un pasaje subterráneo conectado con la Cueva de San Miguel y la costa africana.</p><p><strong>LOS MONOS COMO VIGÍAS:</strong> La tradición conecta a los macacos con la defensa del Peñón, incluyendo historias de que su comportamiento alertaba a la guarnición británica sobre el peligro.</p><p><strong>TRAER MONOS DE ÁFRICA / WINSTON CHURCHILL:</strong> Entre los habitantes de Gibraltar circula la tradición de que Winston Churchill habría dado la orden de traer monos de África. Algunos historiadores repiten esta tesis. Sin embargo, no existe un documento confirmado ni una orden de Churchill que confirme esta tesis. <em>Nota de archivo:</em> Se trata como tradición/folklor local, no como un hecho histórico establecido.</p>`,

                p1Content: `<p><strong>LES CARTES DE GIBRALTAR ET LES SINGES :</strong> L'une des plus anciennes légendes associées à Gibraltar concerne les cartes de Gibraltar et les macaques de Barbarie. Selon l'histoire traditionnelle, la présence des singes a été liée à la croyance selon laquelle la Grande-Bretagne conserverait Gibraltar tant que des singes resteraient sur le Rocher. La légende est souvent exprimée par l'idée que si les singes disparaissaient de Gibraltar, la Grande-Bretagne finirait par perdre Gibraltar.</p><p><strong>LA LÉGENDE DE LA CARTE :</strong> Selon le récit traditionnel, l'histoire a été associée à l'idée que la présence des singes faisait effectivement partie de la condition déterminant l'avenir du Gibraltar britannique.</p><p><strong>ORIGINE POSSIBLE — UNE PLAISANTERIE DU CÔTÉ ESPAGNOL :</strong> Selon une explication traditionnelle, la légende a peut-être commencé comme une blague du côté espagnol de Gibraltar. La blague faisait référence de manière humoristique à la possession britannique et reliait la présence continue de la Grande-Bretagne à la présence continue des singes. <em>Note d'archives :</em> Traité comme une explication folklorique traditionnelle, et non comme un fait historique avéré.</p><p><strong>GROTTE DE SAINT-MICHEL :</strong> Une légende traditionnelle raconte que les singes ont atteint Gibraltar depuis l'Afrique du Nord par un passage souterrain relié à la grotte de Saint-Michel et à la côte africaine.</p><p><strong>LES SINGES EN TANT QUE GARDIENS :</strong> La tradition relie les macaques à la défense du Rocher, y compris des histoires selon lesquelles leur comportement a alerté la garnison britannique d'un danger.</p><p><strong>AMENER DES SINGES D'AFRIQUE / WINSTON CHURCHILL :</strong> Parmi les habitants de Gibraltar circule la tradition selon laquelle Winston Churchill aurait donné l'ordre d'amener des singes d'Afrique. Certains historiens répètent cette thèse. Cependant, il n'existe aucun document confirmé ni ordre de Churchill confirmant cette thèse. <em>Note d'archives :</em> Traité comme tradition/folklore local, et non comme un fait historique établi.</p>`,

                p1Content: `<p><strong>DE KAARTEN VAN GIBRALTAR EN DE APEN:</strong> Een van de langdurige legenden geassocieerd met Gibraltar betreft de kaarten van Gibraltar en de Berberapen. Volgens het traditionele verhaal werd de aanwezigheid van de apen verbonden met het geloof dat Groot-Brittannië Gibraltar zou behouden zolang apen op de Rots bleven. De legende wordt vaak uitgedrukt door het idee dat als de apen uit Gibraltar zouden verdwijnen, Groot-Brittannië uiteindelijk Gibraltar zou verliezen.</p><p><strong>DE KAART LEGENDE:</strong> Volgens het traditionele verslag werd het verhaal geassocieerd met het idee dat de aanwezigheid van de apen effectief deel uitmaakte van de voorwaarde die de toekomst van het Britse Gibraltar bepaalde.</p><p><strong>MOGELIJKE OORSPRONG — EEN GRAP AAN DE SPAANSE KANT:</strong> Volgens één traditionele verklaring begon de legende mogelijk als een grap aan de Spaanse kant van Gibraltar. De grap verwees humoristisch naar het Britse bezit en verbond de voortdurende aanwezigheid van Groot-Brittannië met de voortdurende aanwezigheid van de apen. <em>Archiefnotitie:</em> Behandeld als een traditionele folkloristische verklaring, niet als vastgesteld historisch feit.</p><p><strong>SINT-MICHIELSGROT:</strong> Een traditionele legende zegt dat de apen Gibraltar vanuit Noord-Afrika bereikten via een ondergrondse doorgang verbonden met de Sint-Michielsgrot en de Afrikaanse kust.</p><p><strong>DE APEN ALS WACHTERS:</strong> Traditie verbindt de makaken met de verdediging van de Rots, inclusief verhalen dat hun gedrag het Britse garnizon waarschuwde voor gevaar.</p><p><strong>APEN UIT AFRIKA HALEN / WINSTON CHURCHILL:</strong> Onder de inwoners van Gibraltar circuleert de traditie dat Winston Churchill de opdracht zou hebben gegeven om apen uit Afrika te halen. Sommige historici herhalen deze these. Er bestaat echter geen bevestigd document of bevel van Churchill dat deze these bevestigt. <em>Archiefnotitie:</em> Behandeld als lokale traditie/folklore, niet als vastgesteld historisch feit.</p>`,

        function renderTimeline() {
            const timelineList = document.getElementById('timelineList');
            timelineList.innerHTML = '';
            
            const filteredData = timelineData.filter(event => {
                if (selectedEra === 'all') return true;
                return event.eraId === selectedEra;
            });
            
            filteredData.forEach(event => {
                const eventDiv = document.createElement('div');
                eventDiv.className = 'timeline-event';
                if (event.featured) {
                    eventDiv.classList.add('featured');
                }
                
                const yearSpan = document.createElement('span');
                yearSpan.className = 'event-year';
                yearSpan.textContent = event.year;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = 'event-title';
                titleSpan.textContent = event.title[currentLang];
                
                eventDiv.appendChild(yearSpan);
                eventDiv.appendChild(titleSpan);
                
                eventDiv.addEventListener('click', () => {
                    showEventModal(event);
                });
                
                timelineList.appendChild(eventDiv);
            });
        }
        
        // Select era
        function selectEra(eraId) {
            selectedEra = eraId;
            
            // Update era selector buttons
            document.querySelectorAll('.era-selector button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.era-selector button[data-era="${eraId}"]`).classList.add('active');
            
            renderTimeline();
        }
        
        // Render modals
        function renderModals() {
            // Event modal
            const eventModal = document.getElementById('eventModal');
            const eventModalContent = document.getElementById('eventModalContent');
            const eventModalClose = document.getElementById('eventModalClose');
            
            eventModalClose.addEventListener('click', closeModal);
            eventModal.addEventListener('click', (e) => {
                if (e.target === eventModal) {
                    closeModal();
                }
            });
            
            // Legend modal
            const legendModal = document.getElementById('legendModal');
            const legendModalClose = document.getElementById('legendModalClose');
            
            legendModalClose.addEventListener('click', () => {
                legendModal.classList.remove('active');
            });
            legendModal.addEventListener('click', (e) => {
                if (e.target === legendModal) {
                    legendModal.classList.remove('active');
                }
            });
            
            // Language selector
            const langSelect = document.getElementById('langSelect');
            langSelect.addEventListener('change', (e) => {
                currentLang = e.target.value;
                renderTimeline();
                renderLegend();
                renderAbout();
                renderEraSelector();
                renderHeader();
            });
            
            // Legend button
            const legendBtn = document.getElementById('legendBtn');
            legendBtn.addEventListener('click', () => {
                legendModal.classList.add('active');
            });
        }
        
        // Close modal
        function closeModal() {
            const eventModal = document.getElementById('eventModal');
            eventModal.classList.remove('active');
      }        // Show event modal
        function showEventModal(event) {
            const modal = document.getElementById('eventModal');
            const content = document.getElementById('eventModalContent');
            
            let layersHtml = '';
            
            const layerOrder = ['fact', 'folklore', 'fiction', 'anomaly'];
            
            layerOrder.forEach(layerType => {
                if (event.layers[layerType]) {
                    const layer = event.layers[layerType];
                    const label = layerLabels[layerType][currentLang];
                    const icon = layerIcons[layerType];
                    
                    layersHtml += `
                        <div class="event-layer ${layerType}">
                            <div class="layer-header">
                                <span class="layer-icon">${icon}</span>
                                <span class="layer-label">${label}</span>
                            </div>
                            <div class="layer-content">${layer[currentLang]}</div>
                        </div>
                    `;
                }
            });
            
            content.innerHTML = `
                <div class="modal-event-year">${event.year}</div>
                <h2 class="modal-event-title">${event.title[currentLang]}</h2>
                <div class="modal-event-meta">
                    <span>${event.era}</span>
                    <span>•</span>
                    <span>${event.period}</span>
                </div>
                <div class="event-layers">
                    ${layersHtml}
                </div>
            `;
            
            modal.classList.add('active');
        }

            document.getElementById('legendBtn').textContent = translations.legendButton[currentLang];
            document.getElementById('timelineTitle').textContent = translations.timelineTitle[currentLang];

        function renderEraSelector() {
            const eraSelector = document.querySelector('.era-selector');
            eraSelector.innerHTML = '';
            
            const eras = [
                { id: 'all', label: translations.allEras[currentLang] },
                { id: 'era-1', label: 'ERA I — THE ROCK' },
                { id: 'era-2', label: 'ERA II — THE MONKEYS' },
                { id: 'era-3', label: 'ERA III — THE HIDDEN INSTITUTION' },
                { id: 'era-4', label: 'ERA IV — THE RESEARCH ERA' },
                { id: 'era-5', label: 'ERA V — THE G-ROCK TRANSITION' },
                { id: 'era-6', label: 'ERA VI — THE G-ROCK ERA' }
            ];
            
            eras.forEach(era => {
                const button = document.createElement('button');
                button.textContent = era.label;
                button.setAttribute('data-era', era.id);
                if (era.id === selectedEra) {
                    button.classList.add('active');

                button.addEventListener('click', () => {
                    selectEra(era.id);

                eraSelector.appendChild(button);

        // Initialize app

            renderHeader();
            renderEraSelector();
