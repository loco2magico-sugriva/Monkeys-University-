<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caribbean Campus</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#05070d;
color:#e6e6e6;
}

header{
padding:14px;
text-align:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
color:#4aa3ff;
letter-spacing:2px;
}

.container{
max-width:900px;
margin:30px auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#111827;
border:1px solid #1f2a3a;
border-radius:12px;
padding:20px;
cursor:pointer;
transition:0.2s;
}

.card:hover{
border-color:#4aa3ff;
transform:translateY(-4px);
}

h2{
margin:0;
color:#4aa3ff;
}

small{
opacity:0.7;
}
</style>
</head>

<body>

<header>
CARIBBEAN CAMPUS NODE
</header>

<div class="container">

<div class="grid">

<!-- HAITI -->
<div class="card">
<h2>Haiti Node</h2>
<small>Port-au-Prince / Cultural & Field Research Zone</small>
</div>

<!-- JAMAICA -->
<div class="card">
<h2>Jamaica Node</h2>
<small>Kingston / Economic & Cultural Expansion</small>
</div>

</div>

</div>

</body>
  </html>
