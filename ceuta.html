<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceuta Node — Africa Map</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#05070d;
color:#e6e6e6;
overflow:hidden;
}

/* HEADER */
header{
padding:18px;
text-align:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

h1{
margin:0;
color:#4aa3ff;
letter-spacing:3px;
font-size:22px;
}

/* MAP WRAPPER */
.map{
position:relative;
width:100%;
height:calc(100vh - 65px);
background:#000;
}

/* REAL AFRICA MAP */
.map img{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

/* CEUTA POINT (small but map-anchored, not “floating ball”) */
.ceuta{
position:absolute;
top:18%;
left:49%;
width:10px;
height:10px;
background:#4aa3ff;
border:2px solid white;
border-radius:50%;
cursor:pointer;
box-shadow:0 0 10px rgba(74,163,255,0.6);
}

/* LABEL */
.label{
position:absolute;
top:17%;
left:51%;
font-size:12px;
color:#4aa3ff;
}

/* PANEL */
.panel{
position:absolute;
bottom:20px;
left:20px;
background:#111827;
border:1px solid #1f2a3a;
padding:16px;
border-radius:10px;
max-width:300px;

opacity:0;
transform:translateY(15px);
transition:0.25s;
pointer-events:none;
}

.panel.active{
opacity:1;
transform:translateY(0);
pointer-events:auto;
}

.bridge{
color:#ffcc66;
font-weight:bold;
}

button{
margin-top:10px;
background:#0b0f18;
border:1px solid #1f2a3a;
color:#aaa;
padding:6px 10px;
cursor:pointer;
border-radius:6px;
}

button:hover{
color:#fff;
border-color:#4aa3ff;
}

</style>
</head>

<body>

<header>
<h1>AFRICA MAP — CEUTA NODE</h1>
</header>

<div class="map">

<!-- REAL AFRICA MAP -->
<img src="https://upload.wikimedia.org/wikipedia/commons/8/80/Africa_satellite_orthographic.jpg">

<!-- CEUTA NODE -->
<div class="ceuta" onclick="openPanel()"></div>
<div class="label">Ceuta</div>

<!-- PANEL -->
<div class="panel" id="panel">
<h3 style="color:#4aa3ff;margin-top:0;">Ceuta Node</h3>

Status: <b style="color:#7CFF9B;">ACTIVE</b><br><br>

Intercontinental Bridge: <span class="bridge">ACTIVE</span><br><br>

Connection between Europe and Africa system layers.

<br>
<button onclick="closePanel()">Close</button>
</div>

</div>

<script>
function openPanel(){
document.getElementById("panel").classList.add("active");
}

function closePanel(){
document.getElementById("panel").classList.remove("active");
}
</script>

</body>
</html>
