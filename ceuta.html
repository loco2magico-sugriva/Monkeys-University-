<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa System — Ceuta Node</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#05070d;
color:#e6e6e6;
overflow:hidden;
}

/* HEADER */
header{
padding:16px;
text-align:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header h1{
margin:0;
font-size:18px;
color:#4aa3ff;
letter-spacing:2px;
}

/* MAP AREA */
.map{
position:relative;
width:100%;
height:calc(100vh - 60px);
background:
radial-gradient(circle at 30% 30%, #14233d 0%, transparent 40%),
radial-gradient(circle at 70% 60%, #0e1a2d 0%, transparent 45%),
radial-gradient(circle at 50% 80%, #0b1220 0%, transparent 50%),
#05070d;
overflow:hidden;
}

/* CONTINENT LABEL */
.label{
position:absolute;
top:12%;
left:50%;
transform:translateX(-50%);
font-size:14px;
color:#666;
letter-spacing:3px;
}

/* NODE BASE */
.node{
position:absolute;
width:14px;
height:14px;
border-radius:50%;
background:#4aa3ff;
border:2px solid white;
cursor:pointer;
box-shadow:0 0 12px rgba(74,163,255,0.6);
transition:0.2s;
}

.node:hover{
transform:scale(1.4);
}

/* NODE LABEL */
.node-label{
position:absolute;
font-size:11px;
color:#4aa3ff;
white-space:nowrap;
}

/* POSITIONS (abstract Africa layout, stylized but consistent) */
#morocco{top:35%;left:45%;}
#ceuta{top:32%;left:47%;}
#algeria{top:45%;left:52%;}
#sahara{top:55%;left:48%;}
#nigeria{top:70%;left:55%;}
#southafrica{top:85%;left:60%;}

/* PANEL */
.panel{
position:absolute;
right:20px;
top:20px;
width:280px;
background:#111827;
border:1px solid #1f2a3a;
border-radius:10px;
padding:16px;
display:none;
}

.panel h2{
margin:0;
color:#4aa3ff;
}

.status{
color:#7CFF9B;
font-weight:bold;
}

button{
margin-top:10px;
padding:6px 10px;
background:#0b0f18;
border:1px solid #1f2a3a;
color:#aaa;
cursor:pointer;
border-radius:6px;
}

button:hover{
color:#fff;
border-color:#4aa3ff;
}
</style>
</head>

<body>

<header>
<h1>AFRICA SYSTEM MAP — CEUTA CORE NODE</h1>
</header>

<div class="map">

<div class="label">AFRICA GRID NETWORK</div>

<!-- NODES -->
<div class="node" id="morocco" onclick="openNode('Morocco')"></div>
<div class="node" id="ceuta" onclick="openNode('Ceuta — Intercontinental Bridge')"></div>
<div class="node" id="algeria" onclick="openNode('Algeria')"></div>
<div class="node" id="sahara" onclick="openNode('Sahara Zone')"></div>
<div class="node" id="nigeria" onclick="openNode('Nigeria Hub')"></div>
<div class="node" id="southafrica" onclick="openNode('South Africa Core')"></div>

<!-- LABELS -->
<div class="node-label" style="top:33%;left:48%;">Ceuta</div>
<div class="node-label" style="top:36%;left:46%;">Morocco</div>
<div class="node-label" style="top:47%;left:54%;">Algeria</div>
<div class="node-label" style="top:57%;left:50%;">Sahara</div>
<div class="node-label" style="top:72%;left:57%;">Nigeria</div>
<div class="node-label" style="top:87%;left:62%;">South Africa</div>

<!-- PANEL -->
<div class="panel" id="panel">
<h2 id="title">Node</h2>
<p>Status: <span class="status">ACTIVE</span></p>
<p>System layer connected.</p>
<button onclick="closePanel()">Close</button>
</div>

</div>

<script>
function openNode(name){
document.getElementById("panel").style.display="block";
document.getElementById("title").innerText=name;
}

function closePanel(){
document.getElementById("panel").style.display="none";
}
</script>

</body>
</html>
