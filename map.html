<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock World Map v1.1</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

header{
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header b{letter-spacing:2px;}

header a{
color:#aaa;
text-decoration:none;
font-size:12px;
}

header a:hover{color:#4aa3ff;}

.map{
position:relative;
width:100%;
height:calc(100vh - 60px);
background:radial-gradient(circle at center,#0f1626 0%,#070A10 70%);
overflow:hidden;
}

.node{
position:absolute;
width:200px;
padding:15px;
background:#111827;
border:1px solid #1f2a3a;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.25s;
}

.node:hover{
transform:scale(1.05);
border-color:#4aa3ff;
}

.node h3{
margin:0;
color:#4aa3ff;
font-size:14px;
}

.node p{
font-size:12px;
opacity:0.7;
margin-top:6px;
}

/* POSITIONS */
#uni{top:18%;left:18%;}
#bank{top:62%;left:18%;}
#parl{top:42%;left:48%;}
#ceuta{top:70%;left:75%;}
#epi{top:18%;left:72%;}
</style>
</head>

<body>

<header>
<div><b>G-ROCK WORLD MAP v1.1</b></div>
<div><a href="index.html">Dashboard</a></div>
</header>

<div class="map">

<div class="node" id="uni" onclick="location.href='university.html'">
<h3>Monkeys University of Gibraltar</h3>
<p>Academic Core System</p>
</div>

<div class="node" id="bank" onclick="location.href='bank.html'">
<h3>Bank of the Monkeys</h3>
<p>Economic Layer (MP£)</p>
</div>

<div class="node" id="parl" onclick="location.href='parliament.html'">
<h3>Parliament</h3>
<p>Governance System</p>
</div>

<!-- 🔥 FIX: CEUTA PROPER LINK -->
<div class="node" id="ceuta" onclick="location.href='africa-map.html'">
<h3>Campus de Ceuta</h3>
<p>Africa Expansion Node</p>
</div>

<div class="node" id="epi" onclick="location.href='episode1.html'">
<h3>Episode 1</h3>
<p>Academic Recognition</p>
</div>

</div>

</body>
</html>
