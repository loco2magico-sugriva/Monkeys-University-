<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Rock World Map</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
overflow:hidden;
}

/* HEADER */
header{
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header b{
letter-spacing:2px;
}

header a{
color:#aaa;
text-decoration:none;
font-size:12px;
margin-left:10px;
}

header a:hover{
color:#4aa3ff;
}

/* MAP AREA */
.map{
position:relative;
width:100%;
height:calc(100vh - 60px);
background:
radial-gradient(circle at center, #0f1626 0%, #070A10 70%);
overflow:hidden;
}

/* NODE */
.node{
position:absolute;
width:200px;
padding:15px;
background:#111827;
border:1px solid #1f2a3a;
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.2s;
}

.node:hover{
transform:scale(1.05);
border-color:#4aa3ff;
box-shadow:0 0 20px rgba(74,163,255,0.2);
}

.node h3{
margin:0;
color:#4aa3ff;
font-size:14px;
}

.node p{
font-size:12px;
opacity:0.7;
margin-top:6px;
}

/* CONNECTION LINES (visual only) */
.line{
position:absolute;
height:2px;
background:#1f2a3a;
opacity:0.6;
}

/* POSITIONS */
#uni{top:20%;left:20%;}
#bank{top:60%;left:20%;}
#parl{top:40%;left:50%;}
#ceuta{top:70%;left:75%;}
#epi{top:20%;left:70%;}
</style>

</head>

<body>

<header>
<div><b>G-ROCK WORLD MAP</b></div>
<div>
<a href="index.html">Dashboard</a>
</div>
</header>

<div class="map">

<!-- LINES (visual connections) -->
<div class="line" style="top:30%;left:25%;width:25%;transform:rotate(20deg);"></div>
<div class="line" style="top:50%;left:25%;width:30%;transform:rotate(-10deg);"></div>
<div class="line" style="top:45%;left:55%;width:30%;transform:rotate(25deg);"></div>

<!-- NODES -->
<div class="node" id="uni" onclick="location.href='university.html'">
<h3>Monkeys University</h3>
<p>Academic Core System</p>
</div>

<div class="node" id="bank" onclick="location.href='bank.html'">
<h3>Bank of Monkeys</h3>
<p>Economic Layer (MP£)</p>
</div>

<div class="node" id="parl" onclick="location.href='parliament.html'">
<h3>Parliament</h3>
<p>Governance System</p>
</div>

<div class="node" id="ceuta" onclick="location.href='ceuta.html'">
<h3>Campus de Ceuta</h3>
<p>Africa Expansion Node</p>
</div>

<div class="node" id="epi" onclick="location.href='episode_sugriva_professor.html'">
<h3>Episode</h3>
<p>Academic Recognition Event</p>
</div>

</div>

</body>
</html>
