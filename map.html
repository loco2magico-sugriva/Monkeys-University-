<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-ROCK WORLD MAP</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070A10;
color:#E6E6E6;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
background:#0b0f18;
border-bottom:1px solid #1f2a3a;
}

header b{
letter-spacing:2px;
}

/* TITLE */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:42px;
letter-spacing:3px;
}

/* GRID MAP */
.map{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px;
max-width:1000px;
margin:40px auto;
padding:0 20px;
}

/* NODE */
.node{
background:#111827;
border:1px solid #1f2a3a;
padding:22px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.node:hover{
border-color:#4aa3ff;
transform:translateY(-6px);
box-shadow:0 0 20px rgba(74,163,255,0.2);
}

.tag{
margin-top:10px;
font-size:11px;
color:#4aa3ff;
text-transform:uppercase;
letter-spacing:2px;
}

/* LINE (fake network feel) */
.line{
max-width:900px;
margin:20px auto;
text-align:center;
opacity:0.5;
font-size:12px;
color:#aaa;
}

</style>

</head>
